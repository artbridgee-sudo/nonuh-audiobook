<style>
/* Layout: 한 칸짜리 문제 카드. 위 제목줄, 가운데 문제, 아래로 보기와 해설이 이어짐. */
:root{
  --paper:#EEF1EC; --surface:#F8FAF6; --ink:#1B2320; --muted:#5B6863; --line:#D3DBD5;
  --jade:#2D6A59; --jade-ink:#FFFFFF; --wash:rgba(45,106,89,.13); --slip:#D9CDA6; --slip-ink:#3B3320; --bad:#B3412E;
  --f-display:"Hahmlet","Gowun Batang","Noto Serif TC",serif;
  --f-body:"Gowun Batang","Noto Serif TC","AppleMyungjo","Batang",serif;
  --f-han:"Noto Serif TC","Gowun Batang",serif;
  --f-ui:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111614; --surface:#18201D; --ink:#E2E7E3; --muted:#93A29C; --line:#2B3531;
  --jade:#7CC3AD; --jade-ink:#0E1513; --wash:rgba(124,195,173,.17); --slip:#5C5236; --slip-ink:#F1E8CC; --bad:#F09A85; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111614; --surface:#18201D; --ink:#E2E7E3; --muted:#93A29C; --line:#2B3531;
  --jade:#7CC3AD; --jade-ink:#0E1513; --wash:rgba(124,195,173,.17); --slip:#5C5236; --slip-ink:#F1E8CC; --bad:#F09A85; color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--jade);outline-offset:2px;border-radius:8px}
.ico{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:6px;min-height:54px;padding-inline:8px 14px;background:var(--paper);border-bottom:1px solid var(--line)}
.top button{padding:8px;border-radius:10px;color:var(--muted)}
.top button:hover{background:var(--wash)}
.top b{flex:1;font-family:var(--f-display);font-size:18px;font-weight:700;padding-left:8px}
.top b small{font-family:var(--f-han);font-weight:500;font-size:12px;color:var(--muted);margin-left:6px;letter-spacing:.12em}
.top .pg{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
main{padding:22px 16px 40px}
.wrap{max-width:34em;margin:0 auto;display:grid;gap:16px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:6px 0 4px}
.hero .slip{writing-mode:vertical-rl;text-orientation:upright;font-family:var(--f-han);font-size:20px;letter-spacing:.3em;background:var(--slip);color:var(--slip-ink);padding:14px 9px;border-radius:3px}
.hero h1{margin:0;font-family:var(--f-display);font-size:30px;line-height:1.2}
.hero p{margin:6px 0 0;color:var(--muted);font-size:14px}
.intro{font-family:var(--f-body);font-size:16px;line-height:1.75;color:var(--muted);margin:0;word-break:keep-all}
.rounds{display:grid;gap:10px}
.round{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.round:hover{border-color:var(--jade)}
.han{width:46px;height:46px;display:grid;place-items:center;border-radius:6px;background:var(--slip);color:var(--slip-ink);font-family:var(--f-han);font-size:24px}
.han.two{height:auto;min-height:52px;padding:6px 0;font-size:17px;line-height:1.1;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.06em}
.round b{display:block;font-family:var(--f-display);font-size:17px}
.round small{display:block;color:var(--muted);font-size:13px;margin-top:2px;word-break:keep-all}
.round .best{font-size:12.5px;color:var(--jade);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.meta{font-size:13px;font-weight:600;color:var(--jade);letter-spacing:.04em}
.orig{font-family:var(--f-han);font-weight:500;font-size:24px;line-height:1.6;letter-spacing:.04em;padding:12px 16px;border-left:3px solid var(--slip);background:var(--wash);border-radius:0 8px 8px 0;margin:0;word-break:keep-all}
.qtext{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.5;margin:0;text-wrap:balance;word-break:keep-all}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:center;min-height:58px;padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;font-size:17px;line-height:1.45;word-break:keep-all}
.opt .k{font-weight:600;color:var(--muted);font-size:18px}
.opt:not([disabled]):hover{border-color:var(--jade)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--jade);background:var(--wash)}
.opt.ok .k{color:var(--jade)}
.opt.ng{border-color:var(--bad)}
.opt.ng .k{color:var(--bad)}
.opt.dim{opacity:.5}
#after{display:grid;gap:12px}
#after:empty{display:none}
.ex{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-family:var(--f-body);font-size:16px;line-height:1.75;word-break:keep-all}
.ex b{display:block;font-family:var(--f-ui);font-size:15px;margin-bottom:4px}
.ex b.good{color:var(--jade)}
.ex b.bad{color:var(--bad)}
.ex .src{display:block;margin-top:6px;font-family:var(--f-ui);font-size:12.5px;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 14px;border-radius:12px;font-size:15px;font-weight:600;background:var(--jade);color:var(--jade-ink)}
.btn.ghost{background:transparent;color:var(--jade);border:1px solid var(--jade)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1;min-width:9em}
.score{text-align:center;display:grid;gap:6px;padding:12px 0}
.score .big{font-family:var(--f-display);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:24px;color:var(--muted)}
.score p{margin:0;font-family:var(--f-body);font-size:17px;color:var(--muted);word-break:keep-all}
.miss{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.miss li{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:15px;line-height:1.6;word-break:keep-all}
.miss li span{display:block;color:var(--jade);font-weight:600;margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600}
.foot{margin-top:8px;font-size:12.5px;color:var(--muted);text-align:center}
@media (max-width:380px){.qtext{font-size:19px}.orig{font-size:21px}}
</style>
</head>

<script type="application/json" id="quiz-data">{"rounds":[{"label":"제1편","title":"학이","han":"學而","sub":"『논어』 첫 장 : 때에 맞춰 연습하라 · ‘인(仁)’은 사랑이다"},{"label":"제2편","title":"위정","han":"爲政","sub":"정치나 형벌이 아니라 예 · 부모 봉양이 효인가"},{"label":"제3편","title":"팔일","han":"八佾","sub":"예악의 붕괴 · 미인을 노래한 시"},{"label":"제4편","title":"이인","han":"里仁","sub":"좋은 이웃은 나라의 보배 · 아침에 도를 들으면, 저녁에 죽어도 좋다"},{"label":"제5편","title":"공야장","han":"公冶長","sub":"공자 마음속의 좋은 사위 · 매서운 꾸짖음"},{"label":"제6편","title":"옹야","han":"雍也","sub":"부(富)의 분배 기준 · 안빈낙도, 정말 즐거울까?"},{"label":"제7편","title":"술이","han":"述而","sub":"공자의 네 가지 걱정 · 공자가 노래 부르지 않은 날"},{"label":"제8편","title":"태백","han":"泰伯","sub":"죽음을 앞둔 새는 구슬피 울고, 죽음에 임박한 사람은 선한 말을 한다 · 짐은 무거운데 갈 길은 멀다"},{"label":"제9편","title":"자한","han":"子罕","sub":"위대하도다, 공자여! · 봉황새가 오지 않는구나"},{"label":"제10편","title":"향당","han":"鄕黨","sub":"공공장소에서의 공자 · 식탁의 원칙"},{"label":"제11편","title":"선진","han":"先進","sub":"도움이 안 되는 안회(顔回) · 제자의 장례 비용을 위해 수레를 팔지 않았다"},{"label":"제12편","title":"안연","han":"顔淵","sub":"“예가 아닌 것”은 말하지도 듣지도 보지도 말라 · 온 세상이 모두 형제"},{"label":"제13편","title":"자로","han":"子路","sub":"타당한 명분과 부드러운 말 · 공자라면 1년 동안 무엇을 할 수 있을까?"},{"label":"제14편","title":"헌문","han":"憲問","sub":"공자의 치욕관(恥辱觀) · 어르신도 자질이 필요해"},{"label":"제15편","title":"위령공","han":"衛靈公","sub":"궁지에 몰린 군자의 처신 · 살신성인(殺身成仁)의 사상적 원류"},{"label":"제16편","title":"계씨","han":"季氏","sub":"욕을 먹은 애제자 · 신비로운 숫자, 3"},{"label":"제17편","title":"양화","han":"陽貨","sub":"공자도 피할 수 없었던 사람 · 『시경(詩經)』의 진정한 효용"},{"label":"제18편","title":"미자","han":"微子","sub":"세상에 나간 공자와 세상을 등진 은사(隱士) · 농사도 짓지 않고 오곡도 구분 못한 공자?"},{"label":"제19편","title":"자장","han":"子張","sub":"호학(好學)의 정도 · 독자적 학파를 이룬 자하(子夏)"},{"label":"제20편","title":"요왈","han":"堯曰","sub":"하·상·주(夏·商·周) 성왕(聖王)의 통치술"}],"items":[{"q":"『논어』 첫 장입니다. 빈칸에 들어갈 글자는?","o":"學而時□之，不亦說乎？","c":["學 (학)","習 (습)","思 (사)","行 (행)"],"ex":"“배워서 때맞춰 연습하면 또한 기쁘지 아니한가?” 『논어』 전체를 여는 첫 구절입니다. 책은 이 세 구절을 『논어』 전체를 이해하는 열쇠라고 풀이합니다.","v":"1.1","r":0,"a":1},{"q":"유자는 부모에게 효도하고 형제간에 우애 있는 것(효제)이 무엇의 근본이라고 했을까?","o":"孝弟也者，其為仁之本與！","c":["예 (禮)","지 (知)","용 (勇)","인 (仁)"],"ex":"“부모에게 효도하고 형장(兄長)을 공경하는 것이 바로 ‘인’의 근본이다.” 이 말을 한 유자(有子)는 공자의 제자 유약입니다.","v":"1.2","r":0,"a":3},{"q":"말을 번드르르하게 하고 얼굴빛을 꾸미는 사람에게는 무엇이 드물다고 했을까?","o":"巧言令色，鮮矣仁。","c":["재물","지혜","인 (仁)","벗"],"ex":"“입에 꿀을 바르고 얼굴 가득 웃음을 띤다면, 그 사람의 ‘인’은 아마 매우 적을 것이다.”","v":"1.3","r":0,"a":2},{"q":"“나는 날마다 여러 번 나 자신을 돌아본다”고 말한 사람은?","o":"吾日三省吾身","c":["증자","자하","자공","유자"],"ex":"증자는 남을 위한 일에 최선을 다했는지, 벗에게 신의를 지켰는지, 배운 것을 익혔는지를 날마다 돌아본다고 했습니다.","v":"1.4","r":0,"a":0},{"q":"천승지국을 다스리는 법 가운데, 백성의 힘을 동원할 때 무엇을 고려하라고 했을까?","o":"使民以時","c":["날씨","백성의 나이","농사철","나라의 재정"],"ex":"“지출과 비용을 절약하면서 백성을 사랑해야 하고, 민력을 동원할 때는 농사철을 고려해야 한다.”","v":"1.5","r":0,"a":2},{"q":"“과즉물탄개”의 뜻은?","o":"過，則勿憚改。","c":["잘못이 있으면 고치기를 두려워하지 말라","허물은 남에게 미루지 말라","지나친 것은 고치려 하지 말라","지난 일은 다시 꺼내지 말라"],"ex":"“항상 충과 신을 실천하고 자기만 못한 사람과 벗하지 말라. 잘못이 있으면 고치기를 두려워하지 말라.”","v":"1.8","r":0,"a":0},{"q":"자공은 선생님이 어느 나라에 가든 그 나라 정치를 듣게 되는 까닭이 다섯 가지 인품 덕분이라고 했습니다. 여기에 들지 않는 것은?","c":["온화 (溫)","예양 (讓)","용맹 (勇)","검소 (儉)"],"ex":"“선생님의 사람됨이 온화·선량·겸공·검소·예양(溫良恭儉讓)하시기에, 사람들이 모두 기꺼이 자발적으로 말씀드리는 것입니다.”","v":"1.10","r":0,"a":2},{"q":"유자는 예가 발휘하는 작용 가운데 무엇이 가장 중요하다고 했을까?","o":"禮之用，和為貴。","c":["엄격한 질서","윗사람의 권위","화려한 형식","화목과 조화"],"ex":"“예가 발휘하는 작용 가운데 화목과 조화가 가장 중요하다.” 다만 조화만 좇고 예로 절제하지 않으면 이 역시 이룰 수 없다고 덧붙였습니다.","v":"1.12","r":0,"a":3},{"q":"자공이 『시경』의 “여절여차, 여탁여마”를 인용하자 공자가 크게 칭찬했습니다. 이 구절에서 나온 성어는?","c":["교언영색 (巧言令色)","절차탁마 (切磋琢磨)","온고지신 (溫故知新)","과유불급 (過猶不及)"],"ex":"공자는 “사야, 이제 너와 더불어 『시경』을 논할 수 있겠구나. 지난 일을 알려주었더니 앞일을 미루어 알다니” 하고 기뻐했습니다.","v":"1.15","r":0,"a":1},{"q":"남이 나를 알아주지 않음을 걱정하지 말고, 무엇을 걱정하라고 했을까?","o":"不患人之不己知，患不知人也。","c":["내가 가난함","내가 벗이 없음","내가 남을 알지 못함","내가 배우지 못함"],"ex":"“남이 나를 알아주지 않음을 걱정하지 말고, 내가 남을 이해하지 못함을 걱정하라.” 「학이」편의 마지막 장입니다.","v":"1.16","r":0,"a":2},{"q":"공자는 덕으로 하는 정치를 무엇에 비유했을까?","o":"爲政以德，譬如北辰。","c":["높은 산","북극성","큰 강","해와 달"],"ex":"“스스로 그 자리에 있기만 하면 다른 별들이 모두 그 둘레를 돌게 된다.”","v":"2.1","r":1,"a":1},{"q":"정령과 형벌로만 다스리면 백성은 처벌을 피하려고만 할 뿐 무엇이 없다고 했을까?","c":["지혜","부끄러움","두려움","재물"],"ex":"“덕으로 인도하고 예로 규범하면 백성들이 수치심을 느낄 뿐 아니라 내심으로 복종한다(有恥且格).”","v":"2.3","r":1,"a":1},{"q":"공자가 “마흔 살에 미혹되지 않았다”고 한 데서 나와, 마흔 살을 가리키게 된 말은?","c":["이립 (而立)","이순 (耳順)","불혹 (不惑)","지천명 (知天命)"],"ex":"“나는 열다섯 살에 학문에 뜻을 두었고, 서른 살에 자립하였으며, 마흔 살에 미혹되지 않았고, 쉰 살에 천명을 알았으며….” 이 장에서 나이를 이르는 말들이 생겼습니다.","v":"2.4","r":1,"a":2},{"q":"같은 장에서 공자는 예순 살에 어떻게 되었다고 했을까?","c":["자립하였다","귀가 순해졌다","천명을 알았다","법도를 넘지 않게 되었다"],"ex":"“예순 살에 귀가 순해졌고(耳順), 일흔 살에 마음이 하고자 하는 대로 따라도 법도를 넘지 않았다.” 천명을 안 것은 쉰, 자립은 서른 때의 일입니다.","v":"2.4","r":1,"a":1},{"q":"이 책에 따르면, 공자가 만년에 겪은 슬픔을 일어난 순서대로 바르게 놓은 것은?","c":["안회 → 자로 → 아들 공리","자로 → 안회 → 아들 공리","안회 → 아들 공리 → 자로","아들 공리 → 안회 → 자로"],"ex":"68세에 노나라로 돌아온 뒤, 69세에 아들 공리가 죽고, 71세에 안회가 병사했으며, 72세에 자로가 위나라에서 피살되었습니다.","v":"","r":1,"a":3},{"q":"이 책에 따르면 공자는 몇 해를 살았을까?","c":["일흔하나","예순아홉","여든","일흔셋"],"ex":"“공자는 일흔셋을 살았으니, 70세는 사실 이미 공자 생명의 마지막에 이른 것이다.” 공자의 생몰년은 기원전 551~479년입니다.","v":"","r":1,"a":3},{"q":"‘온고지신’ 할 수 있는 사람은 무엇이 될 자격이 있다고 했을까?","o":"溫故而知新，可以為師矣。","c":["스승","임금","재상","성인"],"ex":"“이미 배운 옛 지식이나 경험을 거듭 되새김으로써 새로운 이치나 깨달음을 얻어낼 수 있다면 비로소 스승이 될 자격이 있다.”","v":"2.11","r":1,"a":0},{"q":"‘군자불기’의 뜻으로 알맞은 것은?","o":"君子不器。","c":["군자는 한 가지 쓰임에만 머무는 그릇이 되어서는 안 된다","군자는 남을 도구로 쓰지 않는다","군자는 음식을 가리지 않는다","군자는 좋은 그릇을 탐하지 않는다"],"ex":"“군자는 그릇처럼(단지 일정한 용도만 가져서는) 안 된다.”","v":"2.12","r":1,"a":0},{"q":"배우기만 하고 생각하지 않으면 어둡다. 그렇다면 생각만 하고 배우지 않으면?","o":"學而不思則罔，思而不學則殆。","c":["위태롭다","게을러진다","교만해진다","외로워진다"],"ex":"“글만 읽고 사색하지 않으면 어두워[罔] 미망에 빠지고, 공상만 하고 글을 읽지 않으면 위태롭다[殆].”","v":"2.15","r":1,"a":0},{"q":"“아는 것을 안다 하고, 모르는 것을 모른다 하는 것이 앎이다.” 공자가 이 말을 들려준 제자는?","o":"知之爲知之，不知爲不知，是知也。","c":["안회","증자","자공","자로 (중유)"],"ex":"공자는 “중유야, 내가 너에게 참된 앎의 태도를 알려주마” 하고 이 말을 했습니다. 중유(由)가 바로 자로입니다.","v":"2.17","r":1,"a":3},{"q":"계씨가 자기 집 뜰에서 추게 해 공자를 분노하게 한 ‘팔일무’. 춤추는 사람은 모두 몇 명일까?","c":["36명","16명","8명","64명"],"ex":"책의 설명대로 ‘팔일’은 한 줄에 여덟 명씩 여덟 줄, 모두 64명이 추는 춤입니다. 본래 주 천자의 궁정에서만 출 수 있었고, 대부인 계씨의 집에서는 사일(四佾)까지만 허락되었습니다.","v":"3.1","r":2,"a":3},{"q":"공자는 사람에게 이것이 없으면 예도 음악도 소용없다고 했습니다. 무엇일까?","o":"人而不仁，如禮何？人而不仁，如樂何？","c":["지위","인 (仁)","학식","재물"],"ex":"“만약 한 사람에게 진정한 인심이 없다면, 예를 행한들 무슨 소용이 있겠는가? 음악을 연주한들 무슨 의미가 있겠는가?”","v":"3.3","r":2,"a":1},{"q":"임방이 예의 근본을 묻자 공자의 대답은?","c":["사치스럽기보다 차라리 검소한 편이 낫다","윗사람의 뜻을 따르는 것이 근본이다","옛 제도를 그대로 지키는 것이 근본이다","형식을 빈틈없이 갖추는 것이 먼저다"],"ex":"“대단한 질문이로다! 예는 사치스럽기보다는 차라리 검소한 편이 낫고, 상례는 형식이 잘 갖추어지기보다는 차라리 마음으로 슬퍼하는 편이 낫다.”","v":"3.4","r":2,"a":0},{"q":"계씨가 그 산의 신에게 제사를 지내려 하자 공자는 “그 산의 신이 임방만도 못하단 말인가” 하고 탄식했습니다. 이번 탐방지이기도 한 이 산은?","c":["태산","화산","니산","숭산"],"ex":"“계씨가 태산에서 여제(旅祭)를 지내려 하였다.” 책은 이 ‘여(旅)’가 여행이 아니라 태산의 신에게 올리는 제례이며, 본래 주 천자만 지낼 수 있는 제사였다고 풀이합니다.","v":"3.6","r":2,"a":0},{"q":"군자는 다투는 일이 없다. 굳이 있다면 무엇을 할 때뿐이라고 했을까?","o":"君子無所爭，必也射乎！","c":["말타기","글짓기","바둑","활쏘기"],"ex":"“다툰다면 활쏘기 시합 때뿐일 것이다. 당에 오르며 서로 읍양하고, 내려와서는 서로 술을 권한다. 이것이 군자의 다툼이다.”","v":"3.7","r":2,"a":3},{"q":"자하가 『시경』 구절의 뜻을 묻자 공자가 “회사후소”라고 답했습니다. 뜻은?","o":"繪事後素","c":["그림보다 글씨가 먼저다","그림을 그린 뒤에 바탕을 칠한다","그림은 흰 바탕이 있은 뒤에 그린다","그림은 나중에 흰색으로 덮는다"],"ex":"“그림을 그리는 데는 흰 바탕이 있어야 채색 그림을 그릴 수 있다.” 자하가 “예도 바탕이 갖춰진 뒤에 오는 것입니까?” 하자, 공자는 “나를 일깨워주는 자는 상이로구나!” 하고 기뻐했습니다.","v":"3.8","r":2,"a":2},{"q":"공자가 주공의 사당(태묘)에 들어가 일마다 물었습니다. “예를 안다더니 왜 묻느냐”는 비아냥에 공자의 대답은?","c":["“옛 예법이 바뀌었기 때문이다”","“사당 지키는 이를 시험한 것이다”","“나도 모르는 것이 많다”","“이것이 바로 예다”"],"ex":"어떤 사람이 “누가 추읍 대부의 아들이 예절에 밝다 했는가?” 하자, 공자는 “이것이야말로 예절이다(是禮也)”라고 답했습니다.","v":"3.15","r":2,"a":3},{"q":"자공이 초하루 제사에 바치는 양을 없애려 하자 공자가 한 말은?","o":"賜也！爾愛其羊，我愛其禮。","c":["“양 한 마리로 나라가 망하지 않는다”","“양 대신 소를 바쳐라”","“네 뜻대로 하여라”","“너는 양을 아끼지만, 나는 그 예를 아낀다”"],"ex":"“사야! 너는 그 살아 있는 양을 안타까워하지만, 나는 그 예의를 안타까워한다.” 여기서 ‘고삭희양(告朔餼羊)’이라는 말이 나왔습니다.","v":"3.17","r":2,"a":3},{"q":"의 땅의 국경 관리가 공자를 만나고 나와서, 하늘이 공자를 장차 무엇으로 삼을 것이라고 했을까?","c":["목탁","기둥","등불","거울"],"ex":"“천하에 도가 없어 질서를 잃은 지 이미 너무 오래되었으니, 하늘이 장차 여러분의 선생님을 세상에 경종을 울리는 목탁으로 삼으실 것입니다.”","v":"3.24","r":2,"a":0},{"q":"공자는 순임금의 음악 『소』를 “아름다움도 선함도 극치”라고 했습니다. 무왕의 음악 『무』는?","c":["선함은 극치이나 아름다움이 부족하다","아름다움은 극치이나 선함은 아직 부족하다","『소』보다 낫다","아름다움도 선함도 부족하다"],"ex":"『소』는 “진미진선(盡美盡善)”, 『무』는 “아름다움은 극치에 이르렀으나, 선함이 아직 충분하지 않다”고 평했습니다. ‘진선진미’라는 말이 여기서 나왔습니다.","v":"3.25","r":2,"a":1},{"q":"「이인」편 첫 장. 공자가 가장 아름답다고 한 것은?","o":"里仁爲美。","c":["큰 집에 사는 것","고향에 사는 것","산과 물이 좋은 곳에 사는 것","인덕 있는 이웃과 함께 사는 것"],"ex":"“사는 곳에 인덕이 있는 이가 이웃하는 것이 가장 아름답다. 거처를 택하면서 인덕 있는 이를 이웃으로 삼지 않는다면 어찌 지혜롭다고 하겠는가?”","v":"4.1","r":3,"a":3},{"q":"“아침에 도를 들으면 ○○에 죽어도 좋다.”","o":"朝聞道，夕死可矣。","c":["한 해 뒤","내일","그 자리","저녁"],"ex":"“만약 아침에 인생의 참된 이치를 들을 수 있다면, 그날 저녁에 죽어도 여한이 없다.”","v":"4.8","r":3,"a":3},{"q":"군자는 덕을 마음에 품는다. 소인은 무엇을 품는다고 했을까?","o":"君子懷德，小人懷土。","c":["땅","칼","책","명예"],"ex":"“군자는 도덕을 마음에 두고, 소인은 토지를 마음에 둔다. 군자는 법도를 마음에 두고, 소인은 이익을 마음에 둔다.”","v":"4.11","r":3,"a":0},{"q":"“나의 도는 하나로 꿰뚫는다.” 증자는 이 ‘하나’를 무엇이라고 풀었을까?","o":"吾道一以貫之。","c":["충과 서","예와 악","효와 제","인과 의"],"ex":"“선생님 학설의 핵심 이념은 충(忠)과 서(恕) 두 글자일 따름입니다.”","v":"4.15","r":3,"a":0},{"q":"군자가 밝게 아는 것은 의(義)입니다. 소인이 밝게 아는 것은?","o":"君子喩於義，小人喩於利。","c":["예절 (禮)","형벌 (刑)","음악 (樂)","이익 (利)"],"ex":"“군자가 밝게 아는 것은 의이고, 소인이 밝게 아는 것은 이(利)이다.”","v":"4.16","r":3,"a":3},{"q":"현명하지 못한 사람을 보았을 때 군자는 어떻게 하라고 했을까?","o":"見賢思齊焉，見不賢而內自省也。","c":["그를 꾸짖어 고치게 한다","멀리하고 사귀지 않는다","나에게도 그런 결점이 있는지 돌아본다","못 본 척 지나간다"],"ex":"“현명한 사람을 보면 어깨를 나란히 하기를 생각하고(見賢思齊), 현명하지 못한 사람을 보면 자기 몸에도 같은 결점이 있는지 반성해야 한다.”","v":"4.17","r":3,"a":2},{"q":"부모가 살아 계실 때 멀리 떠나야 한다면 어떻게 하라고 했을까?","o":"父母在，不遠遊，遊必有方。","c":["한 달 안에 돌아온다","행선지를 분명히 알려 드린다","형제에게 부모를 맡긴다","부모를 모시고 함께 간다"],"ex":"“부모가 살아 계시면 멀리 유람하지 않는다. 반드시 나가야 한다면 행선지를 분명히 하여 부모가 알 수 있게 해야 한다.” 이번 여행 떠나기 전에 집에 일정표 한 장 남겨 두시면 공자님 말씀 그대로입니다.","v":"4.19","r":3,"a":1},{"q":"부모의 나이를 꼭 알아야 하는 까닭으로 공자가 든 두 마음은?","c":["한편으로 자랑스럽고, 한편으로 아쉽다","한편으로 감사하고, 한편으로 미안하다","한편으로 존경하고, 한편으로 두렵다","한편으로 기쁘고, 한편으로 걱정된다"],"ex":"“부모의 나이는 모르고 있어서는 안 된다. 한편으로는 그 연세를 기뻐하고, 다른 한편으로는 그 연세를 걱정해야 한다.”","v":"4.21","r":3,"a":3},{"q":"군자는 말과 행동을 어떻게 하고자 한다고 했을까?","o":"君子欲訥於言而敏於行。","c":["말도 행동도 느리게","말은 빠르게, 행동은 신중하게","말은 많이, 행동은 적게","말은 신중하고 느리게, 행동은 민첩하게"],"ex":"“군자는 말은 신중하고 느리게 하되, 행동은 부지런하고 민첩하게 하고자 한다.”","v":"4.24","r":3,"a":3},{"q":"“덕은 외롭지 않으니 반드시 ○○이 있다.”","o":"德不孤，必有鄰。","c":["재물","복","이웃","스승"],"ex":"“덕이 있는 사람은 고독하지 않으니, 반드시 뜻을 같이하는 이가 와서 함께한다.”","v":"4.25","r":3,"a":2},{"q":"공자는 감옥에 갇힌 적이 있는 제자에게 딸을 시집보냈습니다. “그의 잘못이 아니다”라며 사위로 삼은 이 제자는?","c":["남용","칠조개","공야장","자천"],"ex":"“딸을 그에게 시집보낼 만하다. 비록 그가 감옥에 갇힌 적이 있으나, 이는 그의 잘못이 아니다.” 남용에게는 조카딸을 시집보냈습니다(5.2).","v":"5.1","r":4,"a":2},{"q":"“저는 어떻습니까?” 자공이 묻자 공자는 그릇이라 하고, 어떤 그릇이라고 했을까?","o":"女，器也。瑚璉也。","c":["술을 따르는 잔","물을 뜨는 표주박","종묘에서 곡식을 담는 호련","밥을 짓는 솥"],"ex":"“너는 그릇 같은 사람이다.” “어떤 그릇입니까?” “종묘에서 곡식을 담는 호련이다.” 귀한 제기에 빗댄 칭찬입니다.","v":"5.4","r":4,"a":2},{"q":"“도가 행해지지 않으면 뗏목을 타고 바다로 나가리라. 나를 따를 사람은 아마 ○○일 것이다.” 이 제자는?","c":["안회","자유","자로","증자"],"ex":"자로가 이 말을 듣고 기뻐하자, 공자는 “이 사람은 용맹이 나보다 지나치니, 뗏목 만들 나무를 구할 데가 없구나” 하고 말했습니다.","v":"5.7","r":4,"a":2},{"q":"자공이 “안회는 하나를 들으면 열을 알고, 저는 둘을 압니다” 하자 공자의 대답은?","c":["“나도 너도 그에게 미치지 못한다”","“둘을 알면 충분하다”","“안회는 아직 멀었다”","“너도 노력하면 그만큼 된다”"],"ex":"“확실히 미치지 못한다. 나와 너 모두 그에게 미치지 못한다.” 여기서 ‘문일지십(聞一知十)’이라는 말이 나왔습니다.","v":"5.9","r":4,"a":0},{"q":"대낮에 잠을 자다가 “썩은 나무는 조각할 수 없다”는 꾸중을 들은 제자는?","o":"朽木不可雕也","c":["재여 (재아)","자로","염유","번지"],"ex":"“재여가 대낮에 잠을 잤다.” 공자는 이 일 뒤로 사람의 말만 믿지 않고 실제 행동을 살피게 되었다고 했습니다.","v":"5.10","r":4,"a":0},{"q":"도리를 하나 들으면 그것을 실행하기 전에 또 다른 도리를 들을까 봐 두려워했다는 제자는?","c":["증자","안회","자공","자로"],"ex":"“자로는 도리를 들으면 아직 실행하지 못했을 때, 또 다른 도리를 듣게 될까 두려워했다.” 듣는 대로 실천하려던 자로다운 모습입니다.","v":"5.14","r":4,"a":3},{"q":"공문자가 ‘문(文)’이라는 시호를 받은 까닭으로 공자가 든 것은?","c":["아랫사람에게 묻기를 부끄러워하지 않았다","전쟁에서 큰 공을 세웠다","재물을 백성에게 나누었다","시를 잘 지었다"],"ex":"“그는 부지런하고 배움을 좋아하며, 자기보다 지위가 낮은 사람에게 묻는 것을 부끄러워하지 않았다(不恥下問).”","v":"5.15","r":4,"a":0},{"q":"계문자는 세 번 생각한 뒤에야 행동했습니다. 이 말을 들은 공자의 한마디는?","o":"季文子三思而後行。","c":["“참으로 지혜롭구나”","“생각보다 행동이 먼저다”","“다섯 번은 생각해야 한다”","“두 번이면 될 것이다”"],"ex":"“계문자는 세 번 생각한 후에야 행동했다. 공자께서 이를 듣고 말씀하셨다. ‘두 번이면 될 것이다.’” ‘삼사이후행(三思而後行)’이라는 말이 여기서 나왔습니다.","v":"5.20","r":4,"a":3},{"q":"자로가 “선생님의 뜻을 듣고 싶습니다” 하자 공자가 밝힌 뜻은?","o":"老者安之，朋友信之，少者懷之。","c":["공을 세워도 자랑하지 않는 것","노인은 편안하게, 벗은 믿게, 어린이는 품어 주는 것","천하를 두루 다니며 도를 펴는 것","재물을 벗과 함께 나누는 것"],"ex":"자로는 수레와 옷을 벗과 나누겠다 했고, 안회는 장점을 과시하지 않겠다 했습니다. 공자는 “노인에게는 편안함을, 벗에게는 신뢰를, 어린이에게는 보살핌을” 주고 싶다고 했습니다.","v":"5.26","r":4,"a":1},{"q":"열 집밖에 없는 작은 마을에도 나만큼 충성스럽고 미더운 사람은 있을 것이다. 그러나 공자는 무엇만은 자기만 못할 것이라고 했을까?","o":"十室之邑，必有忠信如丘者焉，不如丘之好學也。","c":["음악을 아는 것","예를 아는 것","배움을 좋아하는 것","말을 잘하는 것"],"ex":"“분명히 나처럼 충성스럽고 신실한 사람이 있을 것이다. 다만 나처럼 배움을 좋아하지는 못할 것이다.” 「공야장」편의 마지막 장입니다.","v":"5.28","r":4,"a":2},{"q":"노 애공이 “누가 가장 배움을 좋아합니까?” 하고 묻자, 공자가 안회를 꼽으며 든 두 가지는?","o":"不遷怒，不貳過。","c":["화를 남에게 옮기지 않고, 같은 잘못을 두 번 하지 않았다","책을 많이 읽고, 글을 잘 지었다","가난을 견디고, 부를 탐하지 않았다","스승을 잘 섬기고, 벗을 잘 사귀었다"],"ex":"“결코 남에게 화를 옮기지 않았고(不遷怒), 잘못이 있으면 즉시 고치어 두 번 다시 같은 잘못을 범하지 않았습니다(不貳過). 매우 불행히도 단명하여 죽었습니다.”","v":"6.3","r":5,"a":0},{"q":"부유하게 사신을 떠나는 자화의 어머니에게 곡식을 많이 보낸 염구를 두고 공자가 한 말은?","o":"君子周急不濟富。","c":["군자는 받은 만큼 돌려준다","곡식은 넉넉할수록 좋다","제자의 어머니는 내 어머니와 같다","군자는 급한 사람을 돕지, 부자에게 보태 주지 않는다"],"ex":"“자화가 제나라에 출사할 때, 큰 말을 타고 가볍고 따뜻한 가죽옷을 입었다. 내가 듣건대, 군자는 급한 사람을 구하되 부유한 사람을 보태주지 않는다.”","v":"6.4","r":5,"a":3},{"q":"“한 그릇 밥과 한 표주박 물로 누추한 골목에 살면서도 그 즐거움을 바꾸지 않는다.” 공자가 이렇게 칭찬한 제자는?","c":["자공","안회","자로","재여"],"ex":"“어질도다, 안회여! 한 그릇 밥에 한 표주박 물(一簞食 一瓢飮)…, 안회는 그 즐거움을 바꾸지 않는다.” 책은 안회가 공자처럼 가난한 집안 출신이었다고 소개합니다.","v":"6.11","r":5,"a":1},{"q":"염구가 “선생님의 도가 싫은 게 아니라 힘이 부족합니다” 하자 공자의 대답은?","o":"力不足者，中道而廢；今女畫。","c":["“너는 해 보지도 않고 스스로 선을 긋고 있다”","“나도 힘이 부족하다”","“힘이 부족하면 쉬었다 가라”","“그럼 다른 스승을 찾아라”"],"ex":"“능력이 부족한 자는 반쯤 가다가 힘이 다해 멈추는 것이다. 그런데 너는 지금 걸어보지도 않고 이미 스스로 선을 그어 물러서고 있다(今女畫).”","v":"6.12","r":5,"a":0},{"q":"무성의 장관 자유가 찾아낸 인재 담대멸명은 어떤 사람이었을까?","c":["글씨를 잘 쓰고 셈에 밝았다","말솜씨가 좋아 백성을 잘 달랬다","용맹하여 도적을 잘 막았다","샛길로 다니지 않고, 공무가 아니면 찾아오지 않았다"],"ex":"“담대멸명이라는 사람이 있는데, 길을 걸을 때 샛길로 다니지 않고(行不由徑), 공무가 아니면 일찍이 저의 방에 온 적이 없습니다.”","v":"6.14","r":5,"a":3},{"q":"바탕(질)이 꾸밈(문)을 이기면 거칠고, 꾸밈이 바탕을 이기면 겉치레에 흐릅니다. 군자는?","o":"文質彬彬，然後君子。","c":["바탕을 감추고 꾸밈을 앞세운다","꾸밈을 버리고 바탕만 지킨다","때에 따라 둘 중 하나를 고른다","문과 질이 알맞게 어우러진다 (문질빈빈)"],"ex":"“문채와 질박함이 서로 어우러져 딱 알맞아야 비로소 군자라 할 수 있다(文質彬彬 然後君子).”","v":"6.18","r":5,"a":3},{"q":"아는 사람은 좋아하는 사람만 못하고, 좋아하는 사람은 어떤 사람만 못하다고 했을까?","o":"知之者不如好之者，好之者不如樂之者。","c":["기록하는 사람","실천하는 사람","가르치는 사람","즐거워하는 사람"],"ex":"“아는 사람은 좋아하는 사람만 못하고, 좋아하는 사람은 그 속에서 즐거워하는 사람만 못하다.”","v":"6.20","r":5,"a":3},{"q":"이 구절의 ‘樂’은 어떻게 읽을까?","o":"知者樂水，仁者樂山。","c":["요","악","낙","락"],"ex":"‘좋아한다’는 뜻일 때는 ‘요’로 읽어 ‘지자요수 인자요산’이 됩니다. 같은 글자가 ‘즐겁다’면 락, ‘음악’이면 악입니다. 오디오북도 이렇게 읽습니다.","v":"6.23","r":5,"a":0},{"q":"공자가 “덕으로서 최고의 경지”라고 하면서, 이를 실천하는 사람이 드물어진 지 오래라고 탄식한 것은?","o":"中庸之爲德也，其至矣乎！","c":["효도","중용","검소","충성"],"ex":"“중용은 덕으로서 최고의 경지이다! 지금 사람 중에서는 이미 이를 실천하는 이를 찾아보기 어렵게 된 지 오래되었다.”","v":"6.29","r":5,"a":1},{"q":"공자가 말한 ‘어진 사람’은?","o":"己欲立而立人，己欲達而達人。","c":["남이 나를 세워 줄 때까지 기다리는 사람","남보다 먼저 서고 먼저 이루는 사람","홀로 서서 남에게 기대지 않는 사람","내가 서고 싶으면 남도 세워 주고, 내가 이루고 싶으면 남도 이루게 해 주는 사람"],"ex":"“어진 자란, 자신이 서고자 하면 남도 서게 해주고, 자신이 통달하고자 하면 남도 통달하게 해주는 사람이다. 가까운 곳에서 비유를 찾아 실천할 수 있으면, 그것이 바로 인을 행하는 방법이다.”","v":"6.30","r":5,"a":3},{"q":"공자가 자신을 두고 한 ‘술이부작’의 뜻은?","o":"述而不作，信而好古。","c":["말은 하되 실천하지 않는다","글을 지어도 남에게 보이지 않는다","옛 가르침을 풀어 전할 뿐 새로 지어내지 않는다","배운 것만 말하고 생각은 하지 않는다"],"ex":"“옛 가르침을 풀어 설명하고 이어받을 뿐, 새로 지어내거나 내세우지 않으며, 고전을 깊이 믿고 열애한다.”","v":"7.1","r":6,"a":2},{"q":"공자가 “나도 많이 쇠했구나” 하며 탄식한 까닭은 오랫동안 누구를 꿈에서 뵙지 못해서였을까?","o":"甚矣吾衰也！久矣吾不復夢見周公！","c":["아버지","주공","요임금","노자"],"ex":"“나의 쇠함이 심하구나! 내가 꿈에서 주공을 다시 뵙지 못한 지 이미 오래되었다!” 주공은 노나라의 시조이자 공자가 가장 본받고 싶어 한 인물입니다.","v":"7.5","r":6,"a":1},{"q":"공자는 무엇을 들고 와서 예를 갖춘 사람이라면 누구든 가르쳤다고 했을까?","o":"自行束脩以上，吾未嘗無誨焉。","c":["금 한 냥","비단 한 필","책 한 권","육포 한 묶음"],"ex":"“포 한 묶음(束脩) 이상을 가지고 직접 예를 올린 사람이라면, 나는 일찍이 가르쳐주지 않은 적이 없다.” 아주 작은 예물만 갖추면 누구든 받아들였다는 뜻입니다.","v":"7.7","r":6,"a":3},{"q":"공자의 가르치는 방법. 한 모퉁이를 들어 주었는데 나머지 세 모퉁이를 미루어 알지 못하면?","o":"舉一隅不以三隅反，則不復也。","c":["다른 제자에게 맡긴다","답을 바로 알려 준다","다시 가르쳐 주지 않는다","처음부터 다시 가르친다"],"ex":"“이리저리 생각해도 이해되지 않는 경지에 이르지 않으면 인도해 주지 않고(不憤不啓)… 한 방향을 제시했을 때 여러 방면으로 이해하지 못하면, 다시 가르쳐주지 않는다.”","v":"7.8","r":6,"a":2},{"q":"“삼군을 이끈다면 누구와 함께하시겠습니까?” 하고 자로가 묻자, 공자가 함께하지 않겠다고 한 사람은?","o":"暴虎馮河","c":["써 주면 나아가고 버리면 물러나는 사람","맨손으로 범을 잡고 배 없이 강을 건너다 죽어도 후회 없는 사람","잘 도모하여 일을 이루는 사람","일에 임해 두려워할 줄 아는 사람"],"ex":"“무기도 없이 맨손으로 범을 잡으려 하고, 배도 없이 강을 건너다 죽어도 후회가 없는 자(暴虎馮河), 나는 그런 사람과 함께하지 않겠다. 큰일에 임하여 반드시 두려움을 알고, 잘 도모하여 성사시킬 수 있는 자여야 한다.” 용맹만 앞세우던 자로에게 한 말입니다.","v":"7.11","r":6,"a":1},{"q":"공자가 제나라에서 『소』 음악을 듣고 나서 몇 달 동안 무엇을 몰랐다고 할까?","c":["날짜 가는 것","배고픔","잠드는 시간","고기 맛"],"ex":"“공자께서 제나라에서 『소』라는 음악을 들으시고, 몇 달 동안 고기의 맛을 느끼지 못하시며 말씀하셨다. ‘음악의 아름다움이 이런 경지에 이를 줄은 미처 생각지 못했다.’” 원문은 ‘삼월부지육미(三月不知肉味)’입니다.","v":"7.14","r":6,"a":3},{"q":"공자는 의롭지 않게 얻은 부귀를 무엇과 같다고 했을까?","o":"不義而富且貴，於我如浮雲。","c":["뜬구름","모래성","흐르는 물","가을 낙엽"],"ex":"“거친 음식을 먹고 물을 마시며, 팔꿈치를 구부려 베개 삼아 자더라도, 즐거움이 그 안에 있다. 부당한 방법으로 얻은 부귀는 나에게 있어 하늘에 떠다니는 뜬구름과 같다.”","v":"7.16","r":6,"a":0},{"q":"섭공이 공자의 사람됨을 물었는데 자로가 답하지 못했습니다. 공자가 “이렇게 말하지 그랬느냐” 한 자기 모습은?","c":["하루에 여러 번 자신을 돌아보는 사람","옛것을 풀어 전할 뿐 새로 짓지 않는 사람","뗏목을 타고 바다로 떠나려는 사람","분발하면 밥을 잊고, 즐거우면 근심을 잊어, 늙는 줄도 모르는 사람"],"ex":"“그 사람은 분발하면 밥을 잊고(發憤忘食), 즐거우면 근심을 잊으며(樂以忘憂), 늙음이 곧 닥쳐옴도 미처 알지 못한다.”","v":"7.19","r":6,"a":3},{"q":"공자가 입에 올리지 않았다는 네 가지 ‘괴력난신’에 들지 않는 것은?","o":"子不語怪、力、亂、神。","c":["완력 (力)","예 (禮)","괴이한 일 (怪)","귀신 (神)"],"ex":"“공자께서는 괴이한 일(怪)·완력(力)·반란(亂)·귀신(神)의 일을 말씀하지 않으셨다.”","v":"7.21","r":6,"a":1},{"q":"“세 사람이 길을 가면 반드시 내 스승이 있다.” 공자가 말한 배우는 방법은?","o":"三人行，必有我師焉。","c":["스승은 세 명이면 충분하다","장점은 골라 본받고, 단점은 나를 고치는 거울로 삼는다","길을 떠나 여행하며 배운다","세 사람 이상 모여야 공부가 된다"],"ex":"“그 사람의 장점을 골라 본받고, 그 사람의 단점은 자신이 고친다.”","v":"7.22","r":6,"a":1},{"q":"공자가 “지극한 덕을 지닌 사람”이라고 한 태백. 그가 한 일은?","c":["홍수를 다스려 백성을 살렸다","세 번이나 천하를 아우에게 양보했다","폭군을 몰아내고 나라를 세웠다","예악을 처음 만들었다"],"ex":"“태백은 가히 지극한 덕을 지닌 사람이라 할 수 있다. 세 번이나 천하를 셋째 아우 계력에게 양보했는데, 백성들은 그를 어떤 말로 칭찬해야 할지조차 알지 못했다.”","v":"8.1","r":7,"a":1},{"q":"증자가 임종 때 제자들에게 “내 손과 발을 보아라” 하며 인용한 『시경』 구절에서 나온 말은?","o":"戰戰兢兢，如臨深淵，如履薄冰。","c":["고군분투","우왕좌왕","노심초사","전전긍긍"],"ex":"“조심하고 삼가며(戰戰兢兢), 깊은 못 가에 선 듯, 얇은 얼음 위를 걷는 듯.” 부모께 받은 몸을 상하지 않게 평생 조심하며 살았음을 보인 것입니다.","v":"8.3","r":7,"a":3},{"q":"“새는 죽을 때 그 울음이 슬프고, 사람은 죽을 때 그 말이 ○○.”","o":"鳥之將死，其鳴也哀；人之將死，其言也善。","c":["짧다","선하다","길다","어지럽다"],"ex":"병문안 온 맹경자에게 증자가 한 말입니다. “새는 죽음에 임해 구슬피 울고, 사람은 죽음에 임해 선한 말을 한다.” 이 책 8-1장의 제목이기도 합니다.","v":"8.4","r":7,"a":1},{"q":"“짐은 무겁고 길은 멀다(임중도원).” 증자는 선비가 짊어진 그 무거운 짐을 무엇이라 했을까?","o":"任重而道遠","c":["나라를 지키는 일","인을 실현하는 일","글을 남기는 일","부모를 봉양하는 일"],"ex":"“인을 실현하는 것을 자신의 임무로 삼으니, 이 또한 무겁지 않은가? 이를 목표로 죽어서야 그치니(死而後已), 이 또한 멀지 않은가?”","v":"8.7","r":7,"a":1},{"q":"『시경』으로 일으키고, 예로 서며, 무엇으로 완성한다고 했을까?","o":"興於『詩』，立於禮，成於樂。","c":["활쏘기","음악","역사","정치"],"ex":"“『시경』으로 계발하고, 예로 자신을 세우며, 악(樂)으로 완성한다.” 여기서 樂은 음악을 뜻하는 ‘악’입니다.","v":"8.8","r":7,"a":1},{"q":"주공처럼 뛰어난 재능과 덕이 있어도 이것이 있으면 나머지는 볼 것이 없다고 했습니다. 무엇일까?","c":["가난과 비천함","병약함","교만과 인색함","말더듬"],"ex":"“설령 주공과 같은 재능과 아름다운 덕이 있다 해도, 교만하고 인색하다면 나머지는 볼 것이 없다.”","v":"8.11","r":7,"a":2},{"q":"천하에 도가 있으면 세상에 나선다. 도가 없으면?","o":"天下有道則見，無道則隱。","c":["싸운다","다른 나라로 간다","숨는다","떠돈다"],"ex":"“천하에 도가 있으면 나타나고, 없으면 숨는다. 나라에 도가 있는데 빈천한 것은 부끄러움이고, 나라에 도가 없는데 부귀한 것도 부끄러움이다.” 여기서 見은 ‘현’으로 읽습니다.","v":"8.13","r":7,"a":2},{"q":"“부재기위 불모기정”의 뜻은?","o":"不在其位，不謀其政。","c":["높은 자리일수록 정치를 멀리하라","자리가 없어도 정치를 걱정해야 한다","자리를 지키려고 꾀를 부리지 말라","그 자리에 있지 않으면 그 자리의 일을 도모하지 않는다"],"ex":"“그 지위에 있지 않으면, 그 지위의 정사를 도모하지 않는다.”","v":"8.14","r":7,"a":3},{"q":"공자가 말한 배우는 자세는?","o":"學如不及，猶恐失之。","c":["한 번 배운 것은 다시 보지 않는다","천천히 쉬엄쉬엄 오래 한다","모르는 것은 넘어가고 아는 것만 익힌다","따라잡지 못할 듯 쫓고, 얻은 것도 잃을까 두려워한다"],"ex":"“배움이란 무언가를 쫓아가도 따라잡지 못하는 것처럼 하고, (따라잡았더라도) 오히려 그것을 잃을까 두려워해야 한다.”","v":"8.17","r":7,"a":3},{"q":"공자가 “흠잡을 데가 없다”고 한 우임금. 그 까닭으로 든 것은?","o":"禹，吾無間然矣！","c":["천하를 세 번 양보했다","음악 『소』를 지었다","자기 궁실은 낮게 하고 물길 다스리는 데 힘을 다했다","열 명의 어진 신하를 두었다"],"ex":"“자신의 음식은 소박하게 하면서 제사는 풍성하게 했고, 자신의 의복은 거칠게 하면서 예복은 화려하게 했으며, 자신의 궁실은 낮게 하면서 농업과 수리에는 힘을 다했다.”","v":"8.21","r":7,"a":2},{"q":"공자가 절대 하지 않았다는 네 가지(절사)에 들지 않는 것은?","o":"子絕四：毋意，毋必，毋固，毋我。","c":["남을 꾸짖기","멋대로 짐작하기","반드시 그래야 한다고 단정하기","고집하기"],"ex":"“주관적으로 억측하지 않고(毋意), 절대적으로 단정하지 않으며(毋必), 고집스럽게 집착하지 않고(毋固), 자아를 내세우지 않으셨다(毋我).”","v":"9.4","r":8,"a":0},{"q":"자공이 “아름다운 옥이 있다면 상자에 감춰 두겠습니까, 좋은 값에 팔겠습니까?” 하고 묻자 공자의 대답은?","c":["“옥은 팔지 않고 나누어 준다”","“팔아야지! 나는 알아볼 사람을 기다린다”","“감춰 두어야지, 옥은 귀하니까”","“값은 따지지 말아야 한다”"],"ex":"“팔아야지! 팔아야지! 나는 여기서 알아볼 줄 아는 살 사람을 기다리고 있다.” 이 책 9-3장의 제목이 ‘몸값 오르기를 기다린 공자’입니다.","v":"9.13","r":8,"a":1},{"q":"공자가 동쪽 오랑캐 땅(구이)에 가서 살고 싶다 하자 “누추한데 어떻게 사시렵니까?” 하는 말이 돌아왔습니다. 공자의 대답은?","o":"君子居之，何陋之有？","c":["“그곳 사람들이 나를 반길 것이다”","“군자가 산다면 무슨 누추함이 있겠는가?”","“잠깐 다녀올 뿐이다”","“누추한 곳이 더 편하다”"],"ex":"“군자가 그곳에 산다면, 무슨 누추함이 있겠는가?”","v":"9.14","r":8,"a":1},{"q":"공자가 강가에 서서 “가는 것이 이와 같구나, 밤낮을 쉬지 않는다”고 탄식했습니다. 무엇을 보며 한 말일까?","o":"逝者如斯夫！不捨晝夜。","c":["흐르는 물","떨어지는 꽃잎","날아가는 새","지는 해"],"ex":"“지나간 것은 이 흐르는 물과 같구나! 밤낮으로 쉬지 않고 흐른다.” ‘천상지탄(川上之嘆)’이라 불리는 유명한 장면입니다.","v":"9.17","r":8,"a":0},{"q":"흙을 쌓아 산을 만들다가 한 삼태기만 더 부으면 되는데 멈추었다면, 공자는 그것을 누구 탓이라고 했을까?","c":["함께 일한 사람 탓","흙이 모자란 탓","하늘의 뜻","내가 스스로 멈춘 것"],"ex":"“한 삼태기만 더 부으면 완성인데 멈추려 한다면, 그것은 내가 스스로 멈추는 것이다. 평지에 한 삼태기를 막 쏟았을 뿐이라도 계속 나아간다면, 그것은 내가 스스로 하는 것이다.”","v":"9.19","r":8,"a":3},{"q":"‘후생가외’의 뜻으로 알맞은 것은?","o":"後生可畏","c":["죽은 뒤를 두려워하라","젊은 후학은 경외할 만하다","늦게 배우면 두렵다","뒤에 태어난 사람은 앞사람을 두려워해야 한다"],"ex":"“젊은이는 경외할 만하니, 후학들의 장래가 오늘만 못하리라는 것을 어찌 알겠는가?” 다만 마흔, 쉰이 되어도 도를 듣지 못하면 경외할 것이 못 된다고 덧붙였습니다.","v":"9.23","r":8,"a":1},{"q":"‘제자 삼천’과 함께 공자 문하의 뛰어난 제자들을 일컫는 말은?","c":["칠십이 현인","백팔 현인","삼십육 현인","이십사 현인"],"ex":"책은 공자가 평생 젊은이를 길러 ‘제자 삼천’, ‘칠십이 현인’이라 일컬어질 정도였다고 말합니다.","v":"","r":8,"a":0},{"q":"삼군의 장수는 빼앗을 수 있어도 빼앗을 수 없는 것은?","o":"三軍可奪帥也，匹夫不可奪志也。","c":["임금의 자리","옛 성현의 글","평범한 사람 한 명의 뜻","백성의 재물"],"ex":"“일국 삼군의 무리에서 그 주장을 빼앗을 수는 있으나, 한 사람의 평범한 사나이의 뜻은 빼앗을 수 없다.” 이 책 9-4장 ‘빼앗을 수 없는 필부의 뜻’의 바로 그 구절입니다.","v":"9.26","r":8,"a":2},{"q":"날씨가 추워진 뒤에야 늦게 시드는 줄 알게 된다는 나무는?","o":"歲寒，然後知松柏之後凋也。","c":["소나무와 잣나무","대나무","버드나무","매화나무"],"ex":"“천지가 얼어붙는 계절이 되어서야, 비로소 소나무와 잣나무가 가장 나중에 시드는 것임을 알게 된다.”","v":"9.28","r":8,"a":0},{"q":"지혜로운 자는 미혹되지 않고, 어진 자는 근심하지 않는다. 용감한 자는?","o":"知者不惑，仁者不憂，勇者不懼。","c":["두려워하지 않는다","자랑하지 않는다","다투지 않는다","물러서지 않는다"],"ex":"“지혜로운 자는 미혹되지 않고, 어진 자는 근심하지 않고, 용감한 자는 두려워하지 않는다.”","v":"9.29","r":8,"a":0},{"q":"「향당」편은 공자의 일상 모습을 그립니다. 공자는 고향 마을에서 어떤 모습이었을까?","c":["어른들 앞에서도 거침없이 의견을 냈다","종묘에서처럼 유창하게 말했다","말을 못하는 사람처럼 온순하고 공손했다","늘 제자들을 데리고 다니며 가르쳤다"],"ex":"“공자께서 고향에서는 온순하고 공경스러운 모습으로, 마치 말을 못하는 사람처럼 보였다. 종묘와 조정에서는 말이 분명하고 유창했는데, 다만 비교적 신중하게 말했을 뿐이다.”","v":"10.1","r":9,"a":2},{"q":"공자는 궁궐 문을 드나들 때 문 한가운데에 서지 않았고, 무엇을 밟지 않았을까?","o":"立不中門，行不履閾。","c":["깔아 둔 자리","임금의 그림자","문지방","계단 가운데"],"ex":"“문 한가운데에 서지 않았고 문지방을 밟지 않았다.” 공묘와 공부의 높은 문지방을 넘을 때 한번 떠올려 보세요.","v":"10.4","r":9,"a":2},{"q":"「향당」편이 전하는 공자의 술 마시는 법은?","o":"唯酒無量，不及亂。","c":["술은 입에 대지 않았다","양을 정해 두지 않되, 어지러울 만큼 취하지는 않았다","한 잔 이상은 마시지 않았다","제사 때만 마셨다"],"ex":"“오직 술만은 양을 정하지 않되, 취하도록 마시지 않는다. 시장에서 산 술과 포는 먹지 않는다.” 곡부에서 공부가연(孔府家宴)을 드실 때 참고하세요.","v":"10.8","r":9,"a":1},{"q":"“식불어 침불언”. 공자의 생활 습관으로 맞는 것은?","o":"食不語，寢不言。","c":["밥 먹을 때 대화하지 않고, 잠자리에서 말하지 않았다","밥은 하루 두 끼만 먹었다","식사 전에 반드시 기도했다","늦게 자고 일찍 일어났다"],"ex":"“밥 먹을 때 대화하지 않고, 잠잘 때 말하지 않는다.”","v":"10.10","r":9,"a":0},{"q":"공자는 어떤 자리에는 앉지 않았을까?","o":"席不正，不坐。","c":["바르게 놓이지 않은 자리","높은 사람이 앉던 자리","남쪽을 향한 자리","문 가까운 자리"],"ex":"“좌석이 바르게 놓이지 않으면, 앉지 않는다.”","v":"10.12","r":9,"a":0},{"q":"계강자가 약을 보내오자 공자는 어떻게 했을까?","c":["제자에게 먼저 먹여 보았다","받지 않고 돌려보냈다","절하고 받았지만, 약성을 몰라 감히 먹지 못하겠다고 했다","그 자리에서 바로 먹었다"],"ex":"“계강자가 약을 보내자 공자는 절하여 받으면서 말씀하셨다. ‘제가 이 약의 약성을 전혀 알지 못하오니, 감히 함부로 먹지 못하겠습니다.’”","v":"10.16","r":9,"a":2},{"q":"집 마구간에 불이 났다는 소식을 듣고 조정에서 돌아온 공자가 맨 먼저 물은 것은?","o":"傷人乎？不問馬。","c":["“불은 누가 냈느냐?”","“말은 무사하냐?”","“사람이 다쳤느냐?”","“손해가 얼마냐?”"],"ex":"“공자께서 조정에서 물러나 돌아와서 물었다. ‘사람이 다쳤는가?’ 말이 손실을 입었는지는 묻지 않았다.” 당시 말은 매우 귀한 재산이었습니다.","v":"10.17","r":9,"a":2},{"q":"임금이 부르면 공자는 어떻게 했을까?","o":"君命召，不俟駕行矣。","c":["사흘 재계한 뒤에 갔다","예복을 갖춰 입은 뒤 수레를 타고 갔다","제자를 먼저 보내 뜻을 물었다","수레가 준비되기를 기다리지 않고 먼저 걸어서 갔다"],"ex":"“임금이 부르시자, 공자는 마차가 준비되기를 기다리지 않고 먼저 걸어서 갔다.”","v":"10.20","r":9,"a":3},{"q":"벗이 죽었는데 장례를 치러 줄 친족이 없었습니다. 공자가 한 말은?","o":"於我殯。","c":["“내가 장례를 맡겠다”","“제자들이 치르게 하라”","“고향으로 돌려보내라”","“나라에 알려라”"],"ex":"“벗이 죽었는데 장례를 치를 친족이 없자, 공자가 말하였다. ‘내가 장례를 책임지겠다.’”","v":"10.22","r":9,"a":0},{"q":"공자가 수레 안에서 하지 않았다는 일에 들지 않는 것은?","c":["뒤를 돌아보기","큰 소리로 말하기","꾸벅꾸벅 졸기","손가락으로 가리키기"],"ex":"“수레 안에서는 뒤를 돌아보지 않으셨고, 큰 소리로 말하지 않으셨으며 손가락으로 가리키지 않으셨다.” 조는 것은 적혀 있지 않으니, 버스에서는 편히 쉬셔도 됩니다.","v":"10.26","r":9,"a":2},{"q":"공문의 뛰어난 제자들을 네 분야로 나눈 장(공문사과). ‘언어’, 곧 말솜씨가 뛰어난 제자로 꼽힌 두 사람은?","c":["안연·민자건","자유·자하","염유·자로","재아·자공"],"ex":"“덕행이 뛰어난 이로는 안연·민자건·염백우·중궁이 있고, 말을 잘하는 이로는 재아·자공이 있으며, 정사에 능한 이로는 염유·자로가 있고, 고대 문헌에 통달한 이로는 자유·자하가 있다.”","v":"11.3","r":10,"a":3},{"q":"공자가 “안회는 나에게 도움이 되는 사람이 아니다”라고 한 까닭은?","o":"回也非助我者也，於吾言無所不說。","c":["내 말이면 무엇이든 기뻐할 뿐, 묻거나 따지지 않아서","가난해서 학비를 내지 못해서","공부를 게을리해서","몸이 약해 일을 돕지 못해서"],"ex":"“안회는 나에게 도움이 되는 사람이 아니다. 그는 내 말에 기뻐하지 않는 것이 없다.” 책은 학생의 질문과 반문이 가르침을 온전히 밝히는 데 얼마나 중요한지 보여 주는 대목이라고 풀이합니다.","v":"11.4","r":10,"a":0},{"q":"안연이 죽자 그의 아버지 안로가 아들의 외곽(槨)을 마련하려고 공자에게 청한 것은?","c":["공자의 집에서 장례를 치러 달라","제자들이 돈을 모아 달라","공자의 수레를 팔아 달라","임금에게 부탁해 달라"],"ex":"공자는 “리(아들 공리)가 죽었을 때도 관은 있었지만 곽은 없었소. 대부의 반열에 있으니 도보로 다닐 수는 없소” 하며 들어주지 않았습니다. 이 책 11-2장의 제목이 ‘제자의 장례 비용을 위해 수레를 팔지 않았다’입니다.","v":"11.8","r":10,"a":2},{"q":"가장 아끼던 제자 안연이 죽자 공자는 무엇이라 탄식했을까?","c":["“하늘이 나를 망하게 하는구나!”","“나도 곧 따라가리라”","“이제 누구를 가르치겠는가”","“이것이 운명이로다”"],"ex":"“아! 하늘이 나를 망하게 하는구나! 하늘이 나를 망하게 하는구나!” (天喪予)","v":"11.9","r":10,"a":0},{"q":"자로가 귀신 섬기는 법과 죽음에 대해 묻자 공자의 대답은?","o":"未知生，焉知死？","c":["“아직 삶도 모르는데 어찌 죽음을 알겠는가”","“그것은 노자에게 물어라”","“죽음은 하늘에 맡겨라”","“귀신은 정성껏 섬겨야 한다”"],"ex":"“아직 사람도 제대로 섬기지 못하는데, 어찌 귀신을 섬길 수 있겠는가?” “아직 삶도 알지 못하는데, 어찌 죽음을 알겠는가?”","v":"11.12","r":10,"a":0},{"q":"공자의 말 한마디에 제자들이 자로를 얕보자, 공자가 자로의 경지를 두고 한 말에서 나온 성어는?","o":"由也升堂矣，未入於室也。","c":["화룡점정 (畫龍點睛)","청출어람 (靑出於藍)","등용문 (登龍門)","승당입실 (升堂入室)"],"ex":"“중유는 (말하자면) 이미 당에 오른 경지에 있으며, 다만 아직 방에 들어오지 못한 것일 뿐이다.” 학문이나 기예가 점점 깊어지는 단계를 이르는 말이 되었습니다.","v":"11.15","r":10,"a":3},{"q":"자공이 자장(師)과 자하(商) 중 누가 나으냐 묻자 공자의 대답에서 나온 성어는?","c":["과유불급 (過猶不及)","일이관지 (一以貫之)","온고지신 (溫故知新)","후생가외 (後生可畏)"],"ex":"“전손사(자장)는 지나치고, 복상(자하)은 미치지 못한다. 지나침은 미치지 못함과 같다.”","v":"11.16","r":10,"a":0},{"q":"주공보다 부유한 계씨를 위해 재물을 더 긁어모아 준 제자에게 공자는 “내 문도가 아니다, 북을 울려 성토해도 좋다”고 했습니다. 이 제자는?","o":"非吾徒也。小子鳴鼓而攻之可也。","c":["염구 (염유)","자로","재아","자공"],"ex":"“계씨는 주공보다 더 부유한데도, 염구는 그를 위해 재물을 긁어모아 재산을 더 늘려 주었다.” 이 책 11-3장 ‘공자의 문하에서 쫓겨난 제자’의 이야기입니다.","v":"11.17","r":10,"a":0},{"q":"“들으면 바로 실행해야 합니까?” 자로에게는 “부형이 계신데 어찌 바로 하겠느냐”고 했던 공자가, 같은 질문을 한 염유에게는?","o":"聞斯行諸？","c":["“들으면 바로 실행하라”","“스승에게 먼저 물어라”","“사흘 생각하고 실행하라”","“부형께 먼저 여쭈어라”"],"ex":"까닭을 묻는 공서화에게 공자는 “구는 뒤로 물러서는 경향이 있어 나아가도록 이끌었고, 유는 두 사람 몫을 하려 하니 물러서도록 가르친 것이다”라고 했습니다. 이 책 11-4장 ‘같은 질문에 다른 답’입니다.","v":"11.22","r":10,"a":0},{"q":"제자들이 저마다 뜻을 말하는 자리에서, 공자가 “나는 점(증석)과 함께하겠다”고 감탄한 증석의 바람은?","o":"浴乎沂，風乎舞雩，詠而歸。","c":["작은 나라를 다스려 백성을 넉넉하게 하는 것","천승의 나라를 3년 만에 용감하게 만드는 것","늦봄에 벗들, 아이들과 기수에서 몸을 씻고 무우에서 바람 쐬다 노래하며 돌아오는 것","종묘의 예식에서 작은 보조 역할을 맡는 것"],"ex":"“늦봄에, 봄옷이 이미 완성되었을 때, 어른 대여섯 명과 소년 예닐곱 명을 데리고, 기수에서 목욕하고, 무우에서 바람을 쐬다가, 노래하며 돌아오겠습니다.” 이 책이 ‘『논어』 중 최고의 문장’(11-5장)으로 꼽은 대목입니다. 기수와 무우는 곡부에 있는 곳입니다.","v":"","r":10,"a":2},{"q":"안연이 인을 묻자 공자의 대답. “자기를 이겨 ○로 돌아가는 것이 인이다.”","o":"克己復禮爲仁。","c":["덕 (德)","도 (道)","예 (禮)","의 (義)"],"ex":"“자기를 이겨 예로 돌아가는 것이 인이다.” 실천 조목으로는 “예가 아니면 보지도 듣지도 말하지도 움직이지도 말라”고 했습니다.","v":"12.1","r":11,"a":2},{"q":"“남들은 다 형제가 있는데 나만 없구나” 하고 근심하는 사마우에게 자하가 한 말은?","o":"四海之內，皆兄弟也。","c":["“스승이 곧 형제다”","“형제는 하늘이 정하는 것이니 걱정 말라”","“사해 안이 모두 형제다”","“형제가 없으니 다툴 일도 없다”"],"ex":"“군자가 삼가 행동하여 잘못이 없고, 사람들과 공손하고 예의 있게 지낸다면, 사해 안이 모두 형제이다. 군자가 어찌 형제 없음을 근심하겠는가?” 이 책 12-2장의 제목이 ‘온 세상이 모두 형제’입니다.","v":"12.5","r":11,"a":2},{"q":"자공이 정치를 묻자 공자는 식량, 군비, 백성의 믿음을 꼽았습니다. 끝까지 버릴 수 없다고 한 것은?","c":["식량","법령","백성의 믿음","군비"],"ex":"군비를 먼저, 그다음 식량을 버린다고 했습니다. “예로부터 사람은 모두 죽는 법이지만, 백성이 신뢰하지 않으면 나라가 설 수 없다(民無信不立).”","v":"12.7","r":11,"a":2},{"q":"자공은 “네 마리 말이 끄는 수레도 따라잡지 못한다(사불급설)”고 했습니다. 무엇을 따라잡지 못한다는 걸까?","o":"駟不及舌。","c":["흐르는 세월","바람","소문난 이름","한번 내뱉은 말"],"ex":"“사두마차도 사람의 혀를 따라잡지 못합니다.” 군자는 바탕만 있으면 되지 꾸밈이 무슨 소용이냐는 극자성의 말을 두고, 말을 함부로 했다고 아쉬워한 것입니다.","v":"12.8","r":11,"a":3},{"q":"제나라 경공에게 한 이 대답의 뜻은?","o":"君君，臣臣，父父，子子。","c":["임금은 임금답고, 신하는 신하답고, 아버지는 아버지답고, 자식은 자식다워야 한다","임금 밑에 신하, 아버지 밑에 아들이 있다","임금과 신하, 아버지와 아들은 서로 같아야 한다","임금도 아버지처럼 자식을 길러야 한다"],"ex":"경공은 “훌륭한 말씀입니다! 그렇지 않다면 곡식이 있어도 내가 먹을 수 있겠습니까?” 하고 감탄했습니다.","v":"12.11","r":11,"a":0},{"q":"군자는 남의 나쁜 점은 부추기지 않고, 남의 무엇을 이루어 준다고 했을까?","o":"君子成人之美，不成人之惡。","c":["벼슬","좋은 점 (아름다움)","재산","명예"],"ex":"“군자는 다른 사람의 좋은 일을 완성시켜 주고, 다른 사람의 나쁜 점은 조장하지 않는다. 소인은 이와 반대로 행동한다.” 이 책 12-4장 ‘타인의 아름다움을 완성해 주는 군자’입니다.","v":"12.16","r":11,"a":1},{"q":"계강자가 정치를 묻자 공자는 정치(政)란 무엇이라고 했을까?","o":"政者正也。","c":["힘 (力)","바름 (正)","다스림 (治)","법 (法)"],"ex":"“정이란 바름입니다. 당신이 앞장서서 바른길을 가신다면, 누가 감히 바른 길을 가지 않겠습니까?”","v":"12.17","r":11,"a":1},{"q":"군자의 덕은 바람이고, 소인의 덕은 ○이다. ○ 위로 바람이 불면 반드시 눕는다.","o":"君子之德風，小人之德草。","c":["흙","풀","물","나무"],"ex":"계강자가 무도한 자를 죽이면 어떠냐고 묻자 공자는 “어찌 살육을 쓰십니까? 그대가 선을 바라면 백성도 선해질 것”이라며 이렇게 말했습니다.","v":"12.19","r":11,"a":1},{"q":"번지가 인(仁)을 묻자 공자의 짧은 대답은?","c":["“말을 삼가는 것이다”","“사람을 사랑하는 것이다”","“예를 지키는 것이다”","“사람을 아는 것이다”"],"ex":"“사람을 사랑하는 것이다(愛人).” 지혜를 묻자 “사람을 아는 것이다(知人)”라고 답했습니다.","v":"12.22","r":11,"a":1},{"q":"증자는 군자가 무엇으로 벗을 모은다고 했을까?","o":"君子以文會友，以友輔仁。","c":["술","음악","재물","글 (학문)"],"ex":"“군자는 문(文·학문)으로써 벗을 모으고, 벗의 도움으로 자신의 인덕을 함양한다.” 이 책 12-5장 ‘이문회우(以文會友)란?’의 바로 그 구절입니다. 이번 탐방도 책 한 권으로 모인 이문회우입니다.","v":"12.24","r":11,"a":3},{"q":"위나라 정치를 맡으면 무엇부터 하겠느냐는 자로의 물음에 공자의 대답은?","c":["세금을 줄이겠다","인재를 모으겠다","군대를 기르겠다","명분을 바로잡겠다"],"ex":"“반드시 명분을 바로잡겠다(正名)!” 명분이 바르지 않으면 말이 순조롭지 않고, 결국 백성이 손발 둘 곳을 모르게 된다고 했습니다.","v":"13.3","r":12,"a":3},{"q":"번지가 농사짓는 법을 배우고 싶다고 하자 공자의 대답은?","c":["“내가 직접 가르쳐 주마”","“나는 늙은 농사꾼만 못하다”","“먼저 『시경』을 배워라”","“농사는 천한 일이다”"],"ex":"“나는 (경험 풍부한) 늙은 농사꾼만 못하다.” 채소 가꾸는 법을 묻자 “나는 늙은 채소농사꾼만 못하다”고 했습니다.","v":"13.4","r":12,"a":1},{"q":"윗사람 자신이 바르면 어떻게 된다고 했을까?","o":"其身正，不令而行；其身不正，雖令不從。","c":["명령이 더 엄해진다","명령하지 않아도 행해진다","백성이 저절로 부유해진다","이웃 나라가 두려워한다"],"ex":"“재위자 자신이 바르면 명령하지 않아도 행해지고, 자신이 바르지 않으면 명령해도 따르지 않는다.”","v":"13.6","r":12,"a":1},{"q":"위나라에 가던 길, 공자는 “사람이 많구나!” 하며 할 일을 차례로 말했습니다. 백성이 많아지고 부유해지면 그다음 할 일은?","c":["성을 쌓는다","가르친다","군대를 기른다","세금을 걷는다"],"ex":"수레를 몰던 염유가 묻자 공자는 “백성을 부유하게 해주어야 한다”, 그다음은 “(예악으로) 교화해야 한다”고 했습니다. 서(庶)·부(富)·교(敎)의 순서입니다.","v":"13.9","r":12,"a":1},{"q":"섭공이 정치를 묻자 공자의 대답입니다. 뜻은?","o":"近者說，遠者來。","c":["가까운 사람과 말하고 먼 사람은 오게 한다","가까운 나라와 화해하고 먼 나라를 친다","가까이 있는 사람이 먼저 와야 한다","가까운 사람을 기쁘게 하면 먼 데 사람이 찾아온다"],"ex":"“나라 안의 사람들을 기쁘게 하면 먼 곳의 사람들이 귀부해 온다.” 여기서 說은 ‘기쁠 열’입니다.","v":"13.16","r":12,"a":3},{"q":"거보의 읍재가 된 자하에게 공자가 준 충고 “욕속부달”의 뜻은?","o":"欲速則不達，見小利則大事不成。","c":["서두르면 도리어 이르지 못한다","욕심이 많으면 벼슬이 오르지 않는다","작은 일부터 서둘러 끝내라","빨리 하고 싶으면 남에게 맡겨라"],"ex":"“서두르지 말고 작은 이익에 눈을 돌리지 말라. 서두르면 도리어 목적에 이르지 못하고, 작은 이익에 눈을 돌리면 큰일이 이루어지지 않는다.”","v":"13.17","r":12,"a":0},{"q":"섭공이 “우리 고향의 정직한 사람은 아버지가 양을 훔치자 고발했다”고 자랑했습니다. 공자의 대답은?","c":["“참으로 정직한 사람이다”","“아버지를 고발한 것은 불효이니 벌해야 한다”","“우리 고장의 정직은 다르다. 아버지와 자식이 서로 숨겨 주는 가운데 정직이 있다”","“양을 돌려주면 된다”"],"ex":"“우리 향당의 정직함은 그와 다릅니다. 아버지는 자식을 위해 숨겨 주고 자식은 아버지를 위해 숨겨 주는데, 정직함이 그 가운데 있습니다.” 이 책 13-3장 ‘자식이 부모의 잘못을 숨겨 줄 수 있을까?’에서 자세히 다룹니다.","v":"13.18","r":12,"a":2},{"q":"중용을 지키는 사람을 만날 수 없다면 공자는 ‘광자’나 ‘견자’와 사귀겠다고 했습니다. 둘의 차이는?","o":"狂者進取，狷者有所不爲也。","c":["광자는 부자이고, 견자는 가난하다","광자는 미쳤고, 견자는 개를 기른다","광자는 과감히 나아가고, 견자는 옳지 않은 일은 하지 않는다","광자는 늙었고, 견자는 젊다"],"ex":"“광자는 진취에 용감하고, 견자는 도리를 넘어서는 일은 하려 하지 않는다.” 이 책 13-4장 ‘광(狂)과 견(狷)의 차이’입니다.","v":"13.21","r":12,"a":2},{"q":"“소인은 같아지기만 할 뿐 화합하지 않는다(同而不和).” 그렇다면 군자는?","c":["긍이부쟁 (矜而不爭)","주이불비 (周而不比)","태이불교 (泰而不驕)","화이부동 (和而不同)"],"ex":"“군자는 화합을 추구하되 세속에 뒤섞이지 않고, 소인은 세속에 뒤섞이기만 할 뿐 화합하지 않는다.”","v":"13.23","r":12,"a":3},{"q":"“마을 사람이 모두 그를 좋아하면 어떻습니까?” 하는 자공의 물음에 공자가 더 낫다고 한 사람은?","c":["마을 사람 모두가 싫어하는 사람","마을의 선한 사람은 좋아하고, 나쁜 사람은 싫어하는 사람","마을 사람 모두가 좋아하는 사람","마을 사람 누구도 모르는 사람"],"ex":"“아직 인정할 수 없다. 마을의 선한 사람들이 모두 그를 좋아하고 마을의 나쁜 사람들이 모두 그를 싫어하는 것만 못하다.”","v":"13.24","r":12,"a":1},{"q":"“가난하면서 원망하지 않기는 어렵다.” 그렇다면 부유하면서 교만하지 않기는?","o":"貧而無怨難，富而無驕易。","c":["쉽다","더 어렵다","가난과 같다","불가능하다"],"ex":"“가난하면서도 원망이 없기는 매우 어렵고, 부유하면서도 교만하지 않기는 쉽다.”","v":"14.10","r":13,"a":0},{"q":"자로가 ‘완성된 사람’을 묻자 공자의 대답. “이익을 보면 의를 생각하고, 위태로움을 보면 ○○을 바친다.”","o":"見利思義，見危授命。","c":["재물","이름","벼슬","목숨"],"ex":"“이익을 보면 의로움에 합당한지 생각하고, 위험을 만나면 목숨을 내놓으며, 오랫동안 곤궁한 처지에서도 평생의 약속을 잊지 않으면 성인(成人)이라 할 수 있다.” 안중근 의사가 옥중에서 남긴 글씨로도 잘 알려진 구절입니다.","v":"14.12","r":13,"a":3},{"q":"공자는 관중을 높이 평가하며 “관중이 없었다면 우리는 지금쯤 이렇게 되었을 것”이라 했습니다. 어떻게?","c":["제나라 사람이 되었을 것","글을 모르고 살았을 것","머리를 풀어 헤치고 옷깃을 왼쪽으로 여미었을 것","모두 농사를 짓고 있었을 것"],"ex":"“관중이 없었다면 우리는 이미 이적에 침략당하여 머리를 풀어 헤치고 옷깃을 왼쪽으로 여미었을 것이다(被髮左衽).” 이 책 14-3장 ‘어진 사람으로 불린 무례한 관중’의 이야기입니다.","v":"14.17","r":13,"a":2},{"q":"옛날의 배우는 사람은 자기를 위해 배웠다. 공자가 본 ‘요즘’ 배우는 사람은?","o":"古之學者爲己，今之學者爲人。","c":["남에게 보이려고 배운다","배우기를 싫어한다","벼슬을 얻으려고 배운다","스승 없이 배운다"],"ex":"“고대 학자들의 학습 목적은 자신의 수양을 높이기 위한 것이었는데, 지금의 학자들은 남에게 과시하기 위해 배운다.” 이 책 14-4장 ‘고금 학자들 간 격국의 차이’입니다.","v":"14.24","r":13,"a":0},{"q":"거백옥이 보낸 사자가 “선생께서는 허물을 줄이려 하시지만 아직 잘 못하십니다”라고 답하자, 공자의 반응은?","c":["“주인을 욕되게 하는구나”","“말을 삼가거라”","“거백옥도 별수 없구나”","“훌륭한 사자로다!”"],"ex":"“사자가 떠난 뒤 공자께서 말씀하셨다. ‘훌륭한 사자로다! 훌륭한 사자로다!’” 주인을 높이면서도 겸손하게 전한 말솜씨를 칭찬한 것입니다.","v":"14.25","r":13,"a":3},{"q":"공자가 “어진 이는 근심하지 않고, 지혜로운 이는 미혹되지 않고, 용감한 이는 두려워하지 않는다. 나는 하나도 하지 못한다”고 하자, 자공의 말은?","c":["“저도 하나도 못 합니다”","“그래도 하나는 하십니다”","“그건 바로 선생님 자신을 말씀하신 것입니다”","“그건 안회의 이야기입니다”"],"ex":"자공은 “이것은 바로 선생님께서 자기 자신을 말씀하신 것입니다(夫子自道也)!”라고 했습니다. 이 책 14-5장 ‘스승의 자기 고백’입니다.","v":"14.28","r":13,"a":2},{"q":"“은덕으로 원한을 갚으면 어떻습니까?”라는 물음에 공자의 대답은?","c":["원한도 은덕으로 갚아라","원한은 잊어버려라","원한은 원한으로 갚아라","원한은 정직함으로, 은덕은 은덕으로 갚아라"],"ex":"“그러면 은덕에는 무엇으로 보답하겠는가? 마땅히 정직함으로써 원한에 보답하고, 은덕으로써 은덕에 보답해야 한다(以直報怨 以德報德).”","v":"14.34","r":13,"a":3},{"q":"“아무도 나를 몰라주는구나” 하고 탄식한 공자는, 그래도 누가 자신을 알아줄 것이라고 했을까?","o":"不怨天，不尤人，下學而上達，知我者其天乎！","c":["제자들","하늘","후세 사람들","노나라 임금"],"ex":"“나는 하늘을 원망하지 않고, 남을 탓하지도 않으며, 아래로 배우고 위로 통달하였으니, 나를 알아주는 것은 아마도 하늘일 것이다!”","v":"14.35","r":13,"a":1},{"q":"석문에서 묵은 자로에게 새벽 문지기가 공자를 두고 한 말은?","o":"是知其不可而爲之者與？","c":["“안 되는 줄 알면서도 기어이 하려는 사람 말이오?”","“세상을 등지고 숨어 사는 사람 말이오?”","“밤낮으로 글만 읽는 사람 말이오?”","“나라를 세 번 양보한 사람 말이오?”"],"ex":"“어디서 왔소?” “공씨 문하에서 왔습니다.” “그 사람이 바로 안 된다는 것을 알면서도 기어이 하려는 사람이오?” 이 책 14-6장 ‘안되는 줄 알면서 행하다’입니다.","v":"14.38","r":13,"a":0},{"q":"두 다리를 쩍 벌리고 앉아 공자를 기다리던 옛 친구 원양. 공자는 꾸짖고 나서 어떻게 했을까?","c":["웃으며 술을 권했다","제자들에게 내쫓게 했다","자리를 박차고 돌아갔다","지팡이로 그의 정강이를 두드렸다"],"ex":"“어릴 때는 공손함을 모르더니, 커서는 이렇다 할 것이 없고, 늙어서도 죽지 않으니, 참으로 해충이로다.” 그러면서 지팡이로 그의 정강이를 두드리셨다. 이 책 14-7장 ‘칠칠찮은 공자의 소꿉친구들’입니다.","v":"14.43","r":13,"a":3},{"q":"진나라에서 양식이 끊겨 모두 쓰러지자, 자로가 화가 나서 “군자도 궁할 때가 있습니까?” 하고 물었습니다. 공자의 대답은?","o":"君子固窮，小人窮斯濫矣。","c":["“군자는 결코 궁하지 않다”","“군자도 궁할 수 있다. 다만 소인은 궁하면 못 하는 짓이 없다”","“그러니 이제 노나라로 돌아가자”","“하늘이 곧 양식을 내리실 것이다”"],"ex":"“군자도 물론 궁색한 처지에 이를 수 있다. 그러나 소인은 궁색해지면 (아무 제약도 없이) 못하는 것이 없게 된다.” 이 책 15-1장 ‘궁지에 몰린 군자의 처신’입니다.","v":"15.2","r":14,"a":1},{"q":"뜻있는 선비와 어진 사람은 살기 위해 인을 해치지 않고, 오히려 몸을 버려 인을 이룬다. 여기서 나온 성어는?","o":"志士仁人，無求生以害仁，有殺身以成仁。","c":["견리사의 (見利思義)","극기복례 (克己復禮)","살신성인 (殺身成仁)","임중도원 (任重道遠)"],"ex":"“뜻 있는 선비와 인자는 삶을 탐하고 죽음을 두려워하여 인도를 해치는 일이 없으며, 자신의 생명을 희생하여 인도를 완성하는 경우는 있다.” 이 책 15-2장 ‘살신성인의 사상적 원류’입니다.","v":"15.9","r":14,"a":2},{"q":"“사람이 멀리 내다보지 않으면 반드시 ○○○ 근심이 생긴다.”","o":"人無遠慮，必有近憂。","c":["자식 대에","먼 훗날","나라 밖에서","가까운 데"],"ex":"“사람이 멀리까지 생각하지 않으면, 반드시 가까운 데 근심이 생긴다.” 이 책 15-3장의 제목은 ‘멀리 내다보지 않으면 발등에 불 떨어진다’입니다.","v":"15.12","r":14,"a":3},{"q":"군자는 자신에게서 구한다. 소인은?","o":"君子求諸己，小人求諸人。","c":["남에게서 구한다","책에서 구한다","구하지 않는다","하늘에서 구한다"],"ex":"“군자는 자신에게서 구하고, 소인은 남에게서 구한다.” 이 책 15-4장 제목 그대로입니다.","v":"15.21","r":14,"a":0},{"q":"자공이 “평생 행할 한마디”를 묻자 공자가 꼽은 글자는?","o":"己所不欲，勿施於人。","c":["서 (恕)","효 (孝)","신 (信)","충 (忠)"],"ex":"“그것은 아마 서(恕)이리라! 자기가 원하지 않는 것을 남에게 베풀지 말라.”","v":"15.24","r":14,"a":0},{"q":"“인능홍도 비도홍인”의 뜻은?","o":"人能弘道，非道弘人。","c":["사람이 도를 넓히는 것이지, 도가 사람을 넓히는 것이 아니다","도는 저절로 넓어진다","사람은 도를 넓힐 수 없다","도를 아는 사람은 넓은 마음을 가진다"],"ex":"“사람이 대도를 선양하는 것이지, 도가 사람을 빛나게 하는 것이 아니다.” 이 책 15-5장 ‘사람이 도를 넓히지, 도가 사람을 넓히지 않는다’입니다.","v":"15.29","r":14,"a":0},{"q":"공자는 하루 종일 먹지 않고 밤새 자지 않으며 생각해 본 끝에 무엇을 깨달았다고 했을까?","c":["생각만 하는 것은 배우는 것만 못하다","생각이 깊으면 배울 필요가 없다","잠을 자야 생각이 잘 된다","생각은 혼자 할 때 가장 좋다"],"ex":"“나는 일찍이 종일 먹지 않고 밤새 자지 않으며 생각하였지만, 결과적으로 별로 얻는 것이 없었으니 배우는 것만 못하다.” 이 책 15-6장 ‘배움과 생각의 관계’입니다.","v":"15.31","r":14,"a":0},{"q":"‘유교무류’의 뜻은?","o":"有教無類。","c":["가르침에는 신분이나 부류의 차별이 없다","부류마다 가르침을 달리한다","가르침이 있는 곳에 무리가 없다","가르칠 만한 무리가 따로 없다"],"ex":"“나는 어떤 사람이든 가르칠 수 있으며, 족류(族類)를 구분하지 않는다.” 책은 공자의 제자들이 여러 나라, 여러 계층 출신이었다고 설명합니다.","v":"15.39","r":14,"a":0},{"q":"“도부동 불상위모”의 뜻은?","o":"道不同，不相爲謀。","c":["도가 같으면 꾀를 내지 않는다","추구하는 도가 다르면 함께 일을 꾀하지 않는다","길이 다르면 서로 만나지 않는다","다른 길도 결국 하나로 모인다"],"ex":"“추구하는 도가 다르면, 결코 함께 일을 상의하지 않는다.” 이 책 15-7장 ‘생각이 다르면 함께 어울리지 말라’입니다.","v":"15.40","r":14,"a":1},{"q":"앞을 보지 못하는 악사 면이 찾아왔을 때, 공자는 어떻게 맞이했을까?","c":["“여기는 층계입니다, 여기는 자리입니다” 하며 하나하나 일러 주었다","음악부터 연주해 달라고 청했다","문 앞까지 나가 절만 했다","제자에게 안내를 맡겼다"],"ex":"층계에서는 “여기는 층계입니다”, 자리에서는 “여기는 자리입니다”, 앉은 뒤에는 “아무개가 여기 있고, 아무개가 여기 있습니다” 하고 알려 주었습니다. 자장이 묻자 “이것이 본래 악사를 돕는 도리이다”라고 했습니다.","v":"15.42","r":14,"a":0},{"q":"계씨가 전유를 치려 할 때 공자가 염구를 꾸짖으며 한 말. 나라를 가진 이는 적음을 걱정하지 않고 무엇을 걱정한다고 했을까?","o":"不患寡而患不均，不患貧而患不安。","c":["좁은 땅","고르지 못함","이웃 나라","적은 군사"],"ex":"“인구가 적음을 걱정하지 않고 재부가 고르지 못함을 걱정하며, 가난을 걱정하지 않고 불안정을 걱정한다.” 이 책 16-1장 ‘욕을 먹은 애제자’의 이야기입니다.","v":"16.1","r":15,"a":1},{"q":"공자가 말한 ‘유익한 벗 셋(益者三友)’에 들지 않는 것은?","c":["성실한 벗","말재주가 좋은 벗","정직한 벗","견문이 넓은 벗"],"ex":"정직한 사람, 성실한 사람, 견문이 넓은 사람과 벗하면 유익하고, 겉치레·아첨·말재주에 능한 사람과 벗하면 해롭다고 했습니다.","v":"16.4","r":15,"a":1},{"q":"공자가 말한 ‘유익한 즐거움 셋(익자삼요)’에 드는 것은?","c":["방종하게 노는 것을 즐기는 것","교만하게 노는 것을 즐기는 것","연회에 빠지기를 즐기는 것","남의 좋은 점 말하기를 즐기는 것"],"ex":"“예악으로 절제하는 것을 즐기고, 남의 좋은 점을 칭찬하는 것을 즐기고, 어진 벗이 많은 것을 즐기면 유익하다. 교만하게 노는 것, 방종하게 노는 것, 연회에 빠지는 것을 즐기면 해롭다.” 여기서 ‘좋아한다’는 뜻의 樂은 ‘요’로 읽습니다.","v":"16.5","r":15,"a":3},{"q":"윗사람을 모실 때 저지르기 쉬운 세 허물 가운데, 말할 때가 되었는데도 말하지 않는 것은?","c":["아첨","소경","조급함","숨김"],"ex":"“아직 말할 때가 되지 않았는데 말하는 것은 조급함이고, 말할 때가 되었는데 말하지 않는 것은 숨김이며, 안색을 살피지 않고 경솔하게 입을 여는 것은 소경이다.”","v":"16.6","r":15,"a":3},{"q":"군자의 세 가지 경계(삼계). 젊어서는 색을, 한창때는 다툼을 경계한다. 늙어서는?","c":["고집","게으름","외로움","탐욕"],"ex":"“노년이 되어 혈기가 이미 쇠약해졌을 때는 탐욕스럽게 구하는 것을 경계해야 한다(戒之在得).”","v":"16.7","r":15,"a":3},{"q":"군자가 두려워하는 세 가지(삼외)에 들지 않는 것은?","c":["귀신","성인의 말씀","대인","천명"],"ex":"“군자에게는 세 가지 두려워할 것이 있다. 천명을 두려워하고, 대인을 두려워하고, 성인의 말씀을 두려워한다. 소인은 천명을 알지 못하여 두려워하지 않는다.”","v":"16.8","r":15,"a":0},{"q":"공자가 사람을 네 등급으로 나눈 장. 가장 아래 등급은?","c":["나면서부터 아는 사람","배워서 아는 사람","곤경에 처해서야 배우는 사람","곤경에 처하고도 배우지 않는 사람"],"ex":"“천생으로 총명한 사람은 상등이고, 학습을 통해 비로소 아는 사람은 차등이며, 곤경에 처해서야 배우는 사람은 또 한 등급 낮고, 곤경에 처하고도 배우지 않는 사람은 하등이다.”","v":"16.9","r":15,"a":3},{"q":"군자의 아홉 가지 생각(구사). 이득을 보면 무엇을 생각하라고 했을까?","o":"見得思義。","c":["얼마나 남는가","의로운가","누구와 나눌까","언제 쓸까"],"ex":"“볼 때는 명확히, 들을 때는 분별해서… 의문이 생기면 질문하기를, 분노가 치밀 때는 후환을 조심하고, 이득을 보면 도의를 생각해야 한다(見得思義).”","v":"16.10","r":15,"a":1},{"q":"말이 사천 필이나 있었지만 죽은 날 칭송할 것이 없었던 제나라 경공. 반대로 수양산 아래에서 굶어 죽었지만 지금까지 칭송받는 사람은?","c":["관중과 포숙","요와 순","백이와 숙제","안회와 자로"],"ex":"“제경공은 말이 사천 필이나 되었으나 백성들은 칭송할 만한 것이 하나도 없다고 여겼다. 반면 백이와 숙제는 수양산 아래에서 굶어 죽었으나, 백성들은 오늘날에 이르기까지도 그들을 칭송하고 있다.”","v":"16.12","r":15,"a":2},{"q":"공자가 아들 백어(공리)에게 “이것을 배우지 않으면 말을 할 수가 없다”고 한 것은?","c":["『시』","역사","음악","예"],"ex":"뜰에서 아버지를 지나치던 백어에게 공자는 먼저 『시』를, 다른 날에는 예를 배웠는지 물었습니다. “예를 배우지 않으면 설 수가 없다.”","v":"16.13","r":15,"a":0},{"q":"공자가 만나 주지 않자 양화가 공자에게 보낸 선물은?","c":["좋은 말 한 마리","비단 한 필","삶은 돼지","옥 한 쌍"],"ex":"“양화가 공자를 만나고자 하였으나 공자가 만나주지 않았다. 그래서 공자에게 삶은 돼지를 보냈다.” 공자는 그가 없을 때를 골라 답례하러 갔다가 길에서 딱 마주쳤습니다. 이 책 17-1장 ‘공자도 피할 수 없었던 사람’입니다.","v":"17.1","r":16,"a":2},{"q":"“성상근 습상원”. 사람들 사이를 멀어지게 하는 것은?","o":"性相近也，習相遠也。","c":["타고난 본성","습관","신분","재산"],"ex":"“사람의 본성은 서로 가까운데, 습관이 다름으로 인해 서로 멀어진다.”","v":"17.2","r":16,"a":1},{"q":"무성에서 거문고 노랫소리를 듣고 공자가 “닭 잡는 데 어찌 소 잡는 칼을 쓰랴” 하며 웃었습니다. 그 고을을 다스리던 제자는?","o":"割雞焉用牛刀？","c":["자로","자장","자유 (언언)","자하"],"ex":"자유가 “군자가 도를 배우면 사람을 사랑하게 된다”는 스승의 말을 들어 답하자, 공자는 “언언의 말이 맞다. 방금 한 말은 농담이었다”고 했습니다.","v":"17.4","r":16,"a":2},{"q":"이 책에 나오는 이야기입니다. 유방이 곡부를 포위했을 때 성안에서 흘러나와, 이곳이 공자의 고향임을 깨닫게 한 소리는?","c":["북소리와 함성","종소리","글 읽는 소리","거문고와 노랫소리"],"ex":"유방은 성안의 거문고와 노랫소리를 듣고 공자의 유풍이 남아 있음을 알아차렸고, 항복한 노나라 사람들을 곤경에 빠뜨리지 않았다고 합니다.","v":"","r":16,"a":3},{"q":"공자가 제자들에게 『시경』을 배우라고 권하며, 덤으로 많이 알게 된다고 한 것은?","c":["별자리와 날씨","옛 임금들의 족보","새와 짐승, 풀과 나무의 이름","여러 나라의 말"],"ex":"“『시경』을 배우면 흥기할 수 있고, 관찰할 수 있고, 벗과 어울릴 수 있고, 풍자할 수 있다. 가까이로는 부모를 섬기고, 멀리로는 군주를 섬긴다. 또한 조수와 초목의 이름을 많이 알 수 있다.” 이 책 17-2장 ‘『시경』의 진정한 효용’입니다.","v":"17.9","r":16,"a":2},{"q":"공자가 “덕을 해치는 도둑”이라고 한 ‘향원’은 어떤 사람일까?","o":"鄉願，德之賊也。","c":["원칙 없이 세상에 영합하며 착한 사람인 척하는 사람","원한을 품고 사는 사람","마을의 원님","고향을 떠나지 못하는 사람"],"ex":"“(아첨하고 세속에 영합하며 원칙이 전혀 없으면서) 겉으로 도덕을 지키는 좋은 사람인 척 꾸미는 향원은 곧 도덕의 파괴자이다.” 이 책 17-3장 ‘공자가 싫어했던 그 사람’입니다.","v":"17.13","r":16,"a":0},{"q":"공자는 자주색이 어떤 색의 자리를 빼앗는 것을 미워한다고 했을까?","o":"惡紫之奪朱也","c":["누런색","검은색","흰색","붉은색"],"ex":"“자색이 주색(붉은색)을 전복시키는 것을 싫어하고, 정나라의 음악이 아악을 어지럽히는 것을 싫어하고, 말재주로 나라를 전복시키는 것을 싫어한다.” 이 책 17-4장 ‘붉은색보다 고귀한 보랏빛’입니다. 여기서 惡는 ‘미워할 오’입니다.","v":"17.18","r":16,"a":3},{"q":"“나는 이제 말하지 않으련다” 하는 공자에게 자공이 “그러면 저희는 무엇을 전합니까?” 하자, 공자는 무엇을 예로 들었을까?","o":"天何言哉？四時行焉，百物生焉。","c":["말 대신 노래한 순임금","말없이도 사계절이 돌고 만물이 자라는 하늘","말없이 가르친 주공","말없이 흐르는 강물"],"ex":"“하늘이 어찌 일찍이 말을 하더냐? 사계절은 여전히 운행하고, 만물은 여전히 생장하는데. 하늘이 어찌 무슨 말을 하였더냐?”","v":"17.19","r":16,"a":1},{"q":"삼년상이 너무 길다는 재아에게 공자는 삼년상의 까닭을 무엇으로 설명했을까?","c":["곡식이 삼 년마다 바뀌니까","주공이 그렇게 했으니까","나라 법이 그렇게 정했으니까","자식은 태어나 삼 년이 지나야 부모 품을 벗어나니까"],"ex":"“자식은 태어나 삼 년이 지난 뒤에야 비로소 부모의 품을 벗어난다. 삼년상은 천하에 두루 통용되는 상례이다. 재여도 자기 부모에게 삼 년의 사랑을 받지 않았단 말인가?”","v":"17.21","r":16,"a":3},{"q":"종일 배불리 먹고 마음 쓸 데 없이 지내는 사람에게 공자는 차라리 무엇이라도 하라고 했을까?","o":"飽食終日，無所用心，難矣哉！","c":["낮잠","청소","산책","바둑 같은 놀이"],"ex":"“육박이나 바둑 놀이가 있지 않으냐? 이 놀이라도 하는 것이 한가히 있는 것보다 낫다.” 긴 이동 시간에 퀴즈를 푸는 것도 공자님이 반기실 일입니다.","v":"17.22","r":16,"a":3},{"q":"공자가 “은나라에 세 분의 인자가 있었다”고 한 세 사람에 들지 않는 사람은?","o":"殷有三仁焉。","c":["미자","기자","비간","백이"],"ex":"“미자는 떠나고, 기자는 그의 종이 되었으며, 비간은 간하다가 죽었다. 공자께서 말씀하셨다. ‘은나라에 세 분의 인자가 있었도다!’” 백이는 숙제와 함께 수양산에서 굶어 죽은 사람입니다.","v":"18.1","r":17,"a":3},{"q":"세 번이나 파면당한 유하혜에게 “왜 노나라를 떠나지 않느냐”고 묻자 그의 대답은?","c":["“네 번째에는 떠나겠다”","“곧은 도로 섬기면 어디 간들 세 번 쫓겨나지 않겠는가”","“부모님이 계시니 떠날 수 없다”","“나를 알아줄 임금을 기다린다”"],"ex":"“정직한 도리로 사람을 섬기면, 어디를 간들 여러 번 파면당하지 않겠는가? 만약 비뚤어진 도리로 사람을 섬긴다면, 또 어찌 반드시 부모의 나라를 떠나야 하겠는가?”","v":"18.2","r":17,"a":1},{"q":"공자를 어떻게 대우할지 고민하던 제나라 경공이 끝내 한 말은? 이 말을 듣고 공자는 제나라를 떠났습니다.","c":["“나는 늙어서 그대를 쓸 수 없다”","“노나라로 돌아가시오”","“계씨만큼 대우하겠소”","“우리 나라엔 인재가 넘치오”"],"ex":"“계씨와 맹씨 사이의 대우로 줄 수 있다.” 이어 또 말하기를 “나는 늙었으니, 쓸 수 없다.” 공자가 제나라를 떠났다.","v":"18.3","r":17,"a":0},{"q":"공자가 노나라를 떠나 천하를 떠돌게 된 계기가 된 일은?","c":["제자 자로가 위나라에서 죽었다","노나라 임금이 공자를 감옥에 가두었다","제나라가 보낸 여자 악단에 빠져 계환자가 사흘이나 조회를 열지 않았다","공자의 집에 불이 났다"],"ex":"“제나라 사람이 여자 악대 하나를 노나라에 보냈는데, 계환자가 받아들여 사흘 동안 조례를 거행하지 않았다. 이에 공자가 노나라를 떠났다.”","v":"18.4","r":17,"a":2},{"q":"공자의 수레 곁을 지나며 “봉황이여, 봉황이여, 어찌 덕이 이토록 쇠했는가” 하고 노래한 사람은?","o":"鳳兮鳳兮！何德之衰？","c":["초나라의 광인 접여","노나라의 계환자","은자 장저","제나라의 경공"],"ex":"공자가 수레에서 내려 이야기를 나누려 했으나, 접여는 걸음을 재촉해 피해 버려 끝내 말을 나누지 못했습니다. 이 책 18-1장 ‘세상에 나간 공자와 세상을 등진 은사’의 이야기입니다.","v":"18.5","r":17,"a":0},{"q":"공자가 밭 갈던 장저와 걸닉에게 자로를 보내 물어보게 한 것은?","c":["나루터가 어디인지","다음 마을까지 거리","그 나라 임금의 이름","하룻밤 묵을 곳"],"ex":"“공자가 그 곁을 지나며 자로를 시켜 나루터가 어디에 있는지 물어보게 하였다(問津).” 장저는 “노나라의 그 공구라면 나루터쯤은 이미 알고 있을 것”이라고 비꼬았습니다.","v":"18.6","r":17,"a":0},{"q":"“세상을 피해 숨어 사는 선비를 따르라”는 걸닉의 말을 전해 들은 공자의 대답은?","o":"鳥獸不可與同群，吾非斯人之徒與而誰與？","c":["“다음에는 내가 직접 가서 따지겠다”","“농사짓는 사람과는 말이 통하지 않는다”","“새나 짐승과 무리 지어 살 수는 없다. 내가 이 세상 사람들과 함께하지 않으면 누구와 하겠는가”","“그 말이 옳다, 나도 숨어 살겠다”"],"ex":"“사람이 새나 짐승과 무리를 지어 함께 살아갈 수는 없는 노릇이다. 내가 이 세상 사람들과 함께하지 않는다면 대체 누구와 함께한단 말인가. 천하에 이미 도가 서 있다면, 나 역시 굳이 세상을 바꾸려 하지 않을 것이다.”","v":"18.6","r":17,"a":2},{"q":"뒤처진 자로가 “제 스승을 보셨습니까?” 묻자 지팡이에 농기구를 멘 노인의 대답. “사지를 부지런히 놀리지 않고 ○○도 구별하지 못하면서 누구를 스승이라 하는가.”","o":"四體不勤，五穀不分，孰爲夫子？","c":["오곡","좋은 사람과 나쁜 사람","동서남북","봄과 가을"],"ex":"노인은 쏘아붙이고도 자로를 집에 재워 주며 닭을 잡고 기장밥을 지어 대접했습니다. 이 책 18-2장 ‘농사도 짓지 않고 오곡도 구분 못한 공자?’입니다.","v":"18.7","r":17,"a":0},{"q":"백이·숙제, 유하혜 같은 은자들을 평한 뒤 공자가 밝힌 자신의 태도는?","o":"我則異於是，無可無不可。","c":["반드시 이래야 한다는 것도, 반드시 안 된다는 것도 없다","숨어 살며 거리낌 없이 말한다","뜻을 굽히지 않고 몸을 욕되게 하지 않는다","세상을 피해 산으로 들어간다"],"ex":"“나는 이들과는 다르니, 반드시 이렇게 해야 한다는 것도 없고, 반드시 이렇게 해서는 안 된다는 것도 없다(無可無不可).” 뜻을 굽히지 않은 것은 백이·숙제에 대한 평입니다.","v":"18.8","r":17,"a":0},{"q":"노나라의 시조 주공이 아들 노공에게 준 가르침에 들어 있는 것은?","o":"無求備於一人。","c":["친척은 멀리하고 남을 가까이하라","옛 신하는 모두 바꾸어라","말을 아끼고 사냥을 즐겨라","한 사람에게 모든 것을 다 갖추기를 바라지 말라"],"ex":"“군자는 자기 친족을 소홀히 여기지 않으며, 대신들이 쓰이지 못한다고 원망하게 하지 않는다. 오랜 벗과 옛 신하에게 큰 허물이 없다면 내치지 않으며, 한 사람에게 모든 것을 다 갖추기를 바라지 않는다.”","v":"18.10","r":17,"a":3},{"q":"「자장」편은 공자가 아니라 제자들의 말을 모은 편입니다. “선비는 위태로움을 보면 목숨을 바치고, 이득을 보면 의를 생각한다”고 한 제자는?","o":"士見危致命，見得思義。","c":["자장","자하","자공","증자"],"ex":"“선비 된 자가 위태로운 지경을 마주하여 목숨을 바칠 줄 알고, 이득을 눈앞에 두고서는 그것이 의로운지를 먼저 헤아릴 줄 알며, 제사를 지낼 때는 공경을, 상을 당해서는 슬픔을 다한다면 괜찮다 할 수 있다.”","v":"19.1","r":18,"a":0},{"q":"자하의 제자가 사람 사귀는 법을 묻자, “괜찮은 사람은 사귀고 아니면 물리쳐라”는 자하의 가르침을 들은 자장의 말은?","c":["“벗은 한 사람이면 족하다”","“자하의 말이 옳다”","“군자는 어진 이를 높이되 뭇사람을 포용한다”","“사람은 가려 사귀어야 한다”"],"ex":"“군자는 어진 이를 존경하면서도 뭇사람을 두루 포용하고, 선한 이를 칭찬하면서도 부족한 이를 안쓰럽게 여긴다. 내가 어질지 못하다면 남들이 절로 나를 물리칠 터인데, 어찌 내가 먼저 남을 물리치겠는가.”","v":"19.3","r":18,"a":2},{"q":"자하가 말한 ‘배우기를 좋아하는 사람(호학)’은?","o":"日知其所亡，月無忘其所能。","c":["모르는 것은 묻지 않고 스스로 찾는 사람","날마다 모르던 것을 알고, 달마다 아는 것을 잊지 않는 사람","스승의 말을 모두 외우는 사람","하루도 빠짐없이 책을 읽는 사람"],"ex":"“매일 자기가 모르는 것을 배울 수 있고, 매달 이미 배운 것을 잊지 않으면, 이것이야말로 호학이라 칭할 수 있을 것이다.” 이 책 19-1장 ‘호학(好學)의 정도’입니다. 亡은 여기서 ‘없을 무’로 읽습니다.","v":"19.5","r":18,"a":1},{"q":"자하는 무엇을 하면 “인이 그 가운데 있다”고 했을까?","o":"博學而篤志，切問而近思，仁在其中矣。","c":["제사를 정성껏 받드는 것","널리 배우고 뜻을 굳게 하며, 절실히 묻고 가까운 데서 생각하는 것","말을 줄이고 행동을 빨리 하는 것","벼슬에 나아가 백성을 돌보는 것"],"ex":"“널리 배우고 뜻을 굳게 지키며, 절실한 마음으로 물음을 던지고 눈앞의 가까운 것에서부터 생각을 넓혀나간다면, 인이 바로 그 가운데 있다.” 주희가 엮은 『근사록(近思錄)』의 이름이 이 ‘근사’에서 나왔습니다.","v":"19.6","r":18,"a":1},{"q":"자하가 말한 ‘군자의 세 가지 모습(군자삼변)’으로 맞는 것은?","c":["아침에는 엄하고, 낮에는 온화하고, 밤에는 조용하다","멀리서 보면 엄숙하고, 가까이하면 온화하고, 말을 들으면 엄격하다","젊어서는 날래고, 장년에는 굳세고, 늙어서는 너그럽다","멀리서 보면 다정하고, 가까이하면 무섭고, 말은 부드럽다"],"ex":"“멀리서 바라보면 그 모습이 엄숙하여 존경할 만하고(望之儼然), 가까이하면 온화하여 친근할 만하며(即之也溫), 그의 말을 들으면 엄격하여 구차하지 않다(聽其言也厲).”","v":"19.9","r":18,"a":1},{"q":"“학이우즉사”. 자하의 이 말의 뜻은?","o":"仕而優則學，學而優則仕。","c":["배움이 뛰어나면 반드시 벼슬을 얻는다","배움과 벼슬은 함께할 수 없다","배우고 여력이 있으면 벼슬길에 나아간다","벼슬을 하려면 배움을 그만두어야 한다"],"ex":"“벼슬을 하면서도 여력이 있으면 배움에 힘쓰고, 배우면서도 여력이 있으면 벼슬길에 나아가야 한다.” 이 책 19-3장 ‘배우고 여력이 있으면 벼슬길에 나가라?’에서 흔한 오해를 풀어 줍니다.","v":"19.13","r":18,"a":2},{"q":"자공은 군자의 허물을 무엇에 비유했을까?","o":"君子之過也，如日月之食焉。","c":["흐린 거울","일식과 월식","구름 낀 하늘","가을 서리"],"ex":"“군자의 허물은 마치 일식이나 월식과도 같다. 허물이 있으면 사람들이 모두 그것을 지켜보고, 그 허물을 고치면 사람들이 모두 그를 우러러보게 된다.”","v":"19.21","r":18,"a":1},{"q":"위나라 공손조가 “중니는 대체 어디서 배웠습니까?” 하고 묻자 자공의 대답은?","c":["“스스로 깨치셨습니다”","“노자에게서 배우셨습니다”","“어디서인들 배우지 않으셨겠으며, 어찌 정해진 스승이 있겠습니까”","“주나라 도서관에서 배우셨습니다”"],"ex":"“문왕과 무왕의 도가 아직 땅에 떨어지지 않고 사람들 사이에 남아 있습니다. 저희 선생님께서 어디서인들 배우지 않으셨겠습니까. 또한 어찌 굳이 정해진 한 분의 스승만을 두어야 하겠습니까.”","v":"19.22","r":18,"a":2},{"q":"“자공이 공자보다 낫다”는 말을 전해 듣고 자공이 한 비유. 자기 담장은 어깨 높이라 집 안이 다 들여다보이지만, 선생님의 담장은?","o":"夫子之牆數仞","c":["무너져 있어 아무나 드나든다","가시나무로 둘러쳐 있다","아예 담장이 없다","몇 길이나 높아 문을 찾아 들어가야만 안을 볼 수 있다"],"ex":"“저희 선생님의 담장은 몇 길이나 되어, 그 문을 찾아 들어가지 않고서는 종묘의 아름다움과 백관의 성대함을 볼 수가 없습니다.” 곡부 옛 성의 남문에 걸린 ‘만인궁장(萬仞宮牆)’ 편액이 이 구절에서 나왔습니다. 이 책 19-4장 ‘혼신을 다해 스승을 변호한 자공’입니다.","v":"19.23","r":18,"a":3},{"q":"숙손무숙이 공자를 헐뜯자 자공은 다른 현인은 넘을 수 있는 언덕이지만 공자는 무엇과 같다고 했을까?","c":["해와 달","하늘의 별","태산","큰 바다"],"ex":"“다른 사람의 뛰어남이란 언덕이나 산과 같아서 넘어갈 수 있지만, 중니의 뛰어남은 해와 달과 같아서 도저히 넘어설 수가 없습니다.”","v":"19.24","r":18,"a":0},{"q":"요임금이 순에게 왕위를 물려주며 당부한 말은?","o":"允執其中。","c":["“백성을 엄하게 다스려라”","“진실로 그 중(中)을 굳게 잡아라”","“하늘에 제사를 거르지 마라”","“어진 신하를 다섯 두어라”"],"ex":"“하늘이 정한 제위의 차례가 이제 그대의 몸에 이르렀으니, 진실로 중용의 도를 굳게 붙잡아 실천하라(允執其中).” 순임금도 같은 말로 우에게 왕위를 물려주었습니다.","v":"20.1","r":19,"a":1},{"q":"상나라 탕임금이 하늘에 아뢴 말. “만방에 죄가 있다면 그 죄는 ○○○에 돌려주소서.”","o":"萬方有罪，罪在朕躬。","c":["제 한 몸","이웃 나라","죄지은 자","신하들"],"ex":"“제 한 몸에 죄가 있거든 그 죄를 천하 만방에 미치지 않게 하시고, 천하 만방에 죄가 있거든 그 죄는 마땅히 제 한 몸에 돌려주소서.”","v":"20.1","r":19,"a":0},{"q":"성왕들의 정치에서 중요하게 여긴 네 가지에 들지 않는 것은?","o":"所重：民、食、喪、祭。","c":["군대","상례와 제사","백성","양식"],"ex":"“중요하게 여겨야 할 것은 백성·양식·상례·제사, 이 네 가지이다.”","v":"20.1","r":19,"a":0},{"q":"너그러우면 뭇사람을 얻고, 미더우면 백성이 믿고 따른다. 공평하면?","o":"寬則得衆，信則民任焉，敏則有功，公則說。","c":["백성이 기뻐한다","나라가 부유해진다","하늘이 복을 내린다","적이 두려워한다"],"ex":"“너그러우면 뭇사람의 마음을 얻고, 신의가 있으면 백성이 믿고 따르며, 부지런하면 공을 이루고, 공평하면 백성이 기꺼이 기뻐한다.” 說은 ‘기쁠 열’입니다.","v":"20.1","r":19,"a":0},{"q":"자장이 정치를 묻자 공자는 ‘다섯 가지 미덕(오미)’을 높이라고 했습니다. 여기에 들지 않는 것은?","c":["은혜를 베풀되 낭비하지 않는다","부유하되 나누지 않는다","위엄이 있되 사납지 않다","태연하되 교만하지 않는다"],"ex":"“은혜를 베풀되 낭비하지 않고, 백성을 부리되 원망을 사지 않으며, 바라되 탐욕을 부리지 않고, 태연하되 교만하지 않으며, 위엄이 있되 사납지 않은 것이다.”","v":"20.2","r":19,"a":1},{"q":"공자가 말한 ‘네 가지 악정(사악)’ 가운데, 가르치지 않고 죽이는 것을 무엇이라 했을까?","o":"不教而殺謂之虐。","c":["잔학함 (虐)","인색함","포악함 (暴)","해침 (賊)"],"ex":"“가르치지 않고 죽이는 것을 잔학함이라 하고, 미리 일러두지 않고 성과만을 다그치는 것을 포악함이라 하며, 명령을 더디게 내리고서 갑자기 기한을 재촉하는 것을 남을 해치는 짓이라 한다.”","v":"20.2","r":19,"a":0},{"q":"『논어』는 모두 몇 편으로 이루어져 있을까?","c":["20편","30편","10편","24편"],"ex":"『논어』는 전체 1만 6천 자에도 못 미치는 짧은 텍스트로, 총 20편 512장으로 이루어진 어록입니다. (옮긴이의 글)","v":"","r":19,"a":0},{"q":"『논어』의 마지막 장. 군자가 되려면 무엇을 알아야 한다고 했을까?","o":"不知命，無以爲君子也。","c":["천명","병법","음악","시"],"ex":"“천명을 알지 못하면 군자가 될 수 없고, 예를 알지 못하면 세상에 나설 수 없으며, 말을 알지 못하면 사람을 알아볼 수 없다.”","v":"20.3","r":19,"a":0},{"q":"『논어』의 마지막 장. 말을 알지 못하면 무엇을 할 수 없다고 했을까?","o":"不知言，無以知人也。","c":["사람을 알아볼 수 없다","벼슬을 할 수 없다","벗을 사귈 수 없다","글을 쓸 수 없다"],"ex":"“천명을 알지 못하면 군자가 될 수 없고, 예를 알지 못하면 세상에 나설 수 없으며, 말을 알지 못하면 사람을 알아볼 수 없다.”","v":"20.3","r":19,"a":0},{"q":"『논어』 첫 장은 “불역군자호”로, 마지막 장은 “무이위군자야”로 끝납니다. 『논어』의 처음과 끝을 꿰는 이 말은?","c":["인","학","예","군자"],"ex":"책은 “역대 많은 학자가 『논어』의 마지막 장이 군자의 인격을 논하며 끝맺는 것을 두고 『논어』 전체를 관통하는 중심을 드러낸 것이라 보았다. 핵심은 사람으로 하여금 군자가 되는 법을 배우게 하는 데 있다”고 맺습니다.","v":"20.3","r":19,"a":3}]}</script>
<script>
(function(){
'use strict';
var QZ = JSON.parse(document.getElementById('quiz-data').textContent);
var $ = function(id){ return document.getElementById(id); };
var MARK = ['①', '②', '③', '④'];
var KEY = 'nonuh-quiz-page-v2';
var best = {};
try { best = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e) { best = {}; }
function saveBest(){ try { localStorage.setItem(KEY, JSON.stringify(best)); } catch(e) {} }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
var qz = null;

function rname(r, ri){ return r.label ? r.label + ' · ' + r.title : (ri + 1) + '회 · ' + r.title; }
function home(){
  qz = null;
  $('title').innerHTML = '논어 퀴즈<small>論語</small>'; $('prog').textContent = ''; $('back').hidden = true;
  var h = '<div class="hero"><div class="slip" aria-hidden="true">論語</div><div><h1>논어 퀴즈</h1><p>『논어통독』 진다청 지음 · 김태만 옮김</p></div></div>'
    + '<p class="intro">책에서 뽑은 ' + QZ.items.length + '문제입니다. 제1편부터 제20편까지 편마다 10문제이고, 답을 고르면 바로 정답과 해설이 나옵니다.</p><div class="rounds">';
  h += '<button class="round" data-r="mix"><span class="han" aria-hidden="true">雜</span><span><b>섞어서 10문제</b><small>20편 전체에서 무작위로 나옵니다</small></span><span class="best">' + (best.mix != null ? '최고 ' + best.mix + '/10' : '10문제') + '</span></button>';
  QZ.rounds.forEach(function(r, ri){
    var n = QZ.items.filter(function(x){ return x.r === ri; }).length, b = best[ri];
    h += '<button class="round" data-r="' + ri + '"><span class="han' + ((r.han || '').length > 1 ? ' two' : '') + '" aria-hidden="true">' + esc(r.han || '') + '</span><span><b>' + esc(rname(r, ri)) + '</b><small>' + esc(r.sub || '') + '</small></span><span class="best">' + (b != null ? '최고 ' + b + '/' + n : n + '문제') + '</span></button>';
  });
  h += '</div><p class="foot">한 번 열어 두면 인터넷이 없어도 다시 풀 수 있습니다.</p>';
  $('view').innerHTML = h; window.scrollTo(0, 0);
}
function start(r){
  var set;
  if (r === 'mix'){ set = QZ.items.slice(); for (var i = set.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = set[i]; set[i] = set[j]; set[j] = t; } set = set.slice(0, 10); }
  else set = QZ.items.filter(function(x){ return x.r === r; });
  qz = {set: set, i: 0, score: 0, miss: [], round: r};
  $('title').textContent = r === 'mix' ? '섞어서 10문제' : rname(QZ.rounds[r], r);
  $('back').hidden = false;
  show();
}
function show(){
  var it = qz.set[qz.i];
  $('prog').textContent = (qz.i + 1) + ' / ' + qz.set.length;
  var h = '<div class="meta">' + (qz.i + 1) + '번 문제' + (it.v ? ' · ' + esc(it.v) + '장' : '') + '</div>';
  if (it.o) h += '<p class="orig" lang="zh-Hant">' + esc(it.o) + '</p>';
  h += '<p class="qtext">' + esc(it.q) + '</p><div class="opts">';
  it.c.forEach(function(c, ci){ h += '<button class="opt" data-c="' + ci + '"><span class="k">' + MARK[ci] + '</span><span>' + esc(c) + '</span></button>'; });
  h += '</div><div id="after"></div>';
  $('view').innerHTML = h; window.scrollTo(0, 0);
}
function answer(ci){
  var it = qz.set[qz.i], ok = ci === it.a;
  if (ok) qz.score++; else qz.miss.push(it);
  [].forEach.call(document.querySelectorAll('.opt'), function(b){
    var k = +b.dataset.c; b.disabled = true;
    if (k === it.a) b.classList.add('ok'); else if (k === ci) b.classList.add('ng'); else b.classList.add('dim');
  });
  var last = qz.i === qz.set.length - 1;
  $('after').innerHTML = '<div class="ex"><b class="' + (ok ? 'good' : 'bad') + '">' + (ok ? '정답입니다!' : '아쉬워요. 정답은 ' + MARK[it.a] + '번') + '</b>' + esc(it.ex)
    + (it.v ? '<span class="src">『논어』 ' + esc(it.v) + '장</span>' : '<span class="src">『논어통독』 해설에서</span>') + '</div>'
    + '<button class="btn" id="next">' + (last ? '결과 보기' : '다음 문제') + '</button>';
  $('next').onclick = function(){ if (last) end(); else { qz.i++; show(); } };
  setTimeout(function(){ var a = $('after'); if (a) a.scrollIntoView({block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); }, 30);
}
function end(){
  var n = qz.set.length, key = qz.round === 'mix' ? 'mix' : qz.round;
  if (best[key] == null || qz.score > best[key]) { best[key] = qz.score; saveBest(); }
  $('prog').textContent = '';
  var msg = qz.score === n ? '만점입니다. 공자께서도 기뻐하시겠습니다.' : qz.score >= n * 0.7 ? '훌륭합니다. 틀린 문제만 다시 보면 완벽합니다.' : '틀린 문제를 한 번 더 읽어 보세요.';
  var h = '<div class="score"><div class="big">' + qz.score + '<small> / ' + n + '</small></div><p>' + msg + '</p></div>';
  if (qz.miss.length){
    h += '<div class="meta">다시 볼 문제</div><ul class="miss">';
    qz.miss.forEach(function(it){ h += '<li>' + esc(it.q) + '<span>정답: ' + esc(it.c[it.a]) + '</span></li>'; });
    h += '</ul>';
  }
  h += '<button class="btn ghost" id="share">결과 보내기</button><div class="row"><button class="btn ghost" id="again">다시 풀기</button><button class="btn" id="homeBtn">다른 회차</button></div>';
  $('view').innerHTML = h; window.scrollTo(0, 0);
  $('again').onclick = function(){ start(qz.round); };
  $('homeBtn').onclick = home;
  $('share').onclick = function(){
    var name = qz.round === 'mix' ? '섞어서 10문제' : rname(QZ.rounds[qz.round], qz.round);
    var text = '논어 퀴즈 [' + name + '] ' + qz.score + '/' + n + '점!';
    var url = location.href.split('#')[0];
    if (navigator.share){ navigator.share({title: '논어 퀴즈', text: text, url: url}).catch(function(){}); return; }
    var all = text + ' ' + url;
    if (navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(all).then(function(){ toast('결과를 복사했습니다. 카톡에 붙여 넣으세요.'); }, function(){ toast(all); }); }
    else toast(all);
  };
}
var tt = null;
function toast(s){ var t = $('toast'); t.textContent = s; t.hidden = false; clearTimeout(tt); tt = setTimeout(function(){ t.hidden = true; }, 3000); }

$('view').addEventListener('click', function(e){
  var r = e.target.closest('.round'); if (r){ start(r.dataset.r === 'mix' ? 'mix' : +r.dataset.r); return; }
  var o = e.target.closest('.opt'); if (o && !o.disabled) answer(+o.dataset.c);
});
$('back').onclick = home;
home();
try { if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function(){}); } catch(e) {}
})();
</script>
